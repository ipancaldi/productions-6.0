<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequencing Timeline — Productions</title>
<!--
  ============================================================================
  SEQUENCING TIMELINE — where video content is sequenced, and the only surface
  that decides WHEN a clip runs and WHERE the sequence it belongs to is thrown.

  WHY THIS IS NOT IN THE SCENE STUDY.
  It was a strip pinned under the 3D viewport, and it was in the wrong place for
  three unrelated reasons: it competed for height with the thing it described,
  `?mode=pov` switched it off entirely — so the one view showing what the audience
  sees could not move the cue producing it — and it tied arithmetic about time to
  a WebGL context. The strip is gone from that file now.

  WHAT MOVED AND WHAT DID NOT.
    THIS PANEL owns the SEQUENCE — the grouping, the tracks in it, the clips on
      them, their trims, the show's length and the loop. And the clock.
    THE SCENE STUDY owns the SURFACE — decoding, VideoTexture, which mesh the
      picture lands on, the projector's landing quad, the crop handles on the
      wall. A texture belongs to the context that samples it.

  ---------------------------------------------------------------------------
  THE SEQUENCE IS THE UNIT, NOT THE TRACK.

  A track used to be routed on its own, and cropped on its own. That was wrong in
  the way a spreadsheet is wrong: it let you say things that cannot be true of a
  real rig. A wall shows ONE picture. Six tracks cut against each other to make
  that picture — and it is the PICTURE that is thrown at the wall, cropped into
  its frame, and named in the running order. Routing six tracks individually to
  one wall was six chances to disagree about one fact.

  So the unit is the SEQUENCE:

      SEQUENCE ─┬─ V2 ─── clips          ROUTE  → one surface, for the whole thing
                ├─ V1 ─── clips          CROP   → one frame, for the whole thing
                ├─ A1 ─── clips
                └─ A2 ─── clips

  It has a NAME, so a running order can refer to it. It can be RENAMED, DUPLICATED
  and DELETED, because those are the three things anybody does to a cue once there
  is more than one of them. One sequence is worked on at a time, and the panel says
  which — a lane belonging to a cue you are not editing is a lane you will edit by
  accident.

  VIDEO TAKES PRIORITY, and stacked the way an NLE stacks it: V2 draws over V1, so
  the highest video track carrying a live clip is the picture. Audio tracks run
  underneath and are never thrown at a surface — an LED wall has no speakers, and
  saying otherwise on the wire would be a lie the room would have to ignore.

  WHAT THE ROOM IS TOLD. Not "sequences" — the Scene Study has no use for the
  concept and adding it there would be a second model of the same thing. Each clip
  row on the wire carries the RESOLVED route and crop of the sequence it is in,
  plus its priority. The decision lives here; the consequence travels.

  ONE CLOCK. `transport` is forwarded by the host to every panel of the take, so
  the Scene Study, every Camera POV and the Video Preview are all on this playhead.

  IT RUNS STANDALONE. The protocol is SCENE-STUDY-BRIDGE.md.
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   The palette is NOT authored here. :root carries the BrandOS AA values as a
   standalone default; hosted, the prototype sends its resolved tokens in `hello`
   and they are written onto :root at runtime. One palette, transmitted.
   ========================================================================= */
:root {
  --gray-300: #D0D5DD; --gray-400: #A2ABBA; --gray-500: #858FA2; --gray-550: #62748E;
  --gray-600: #475467; --gray-650: #4F5D72; --gray-700: #344054; --gray-800: #1D2939;
  --gray-900: #101828;

  --surface-canvas: var(--gray-900); --surface-panel: var(--gray-800);
  --surface-raised: var(--gray-700); --surface-selected: var(--gray-700);
  --surface-emphasis: var(--gray-600); --surface-emphasis-hover: var(--gray-650);
  --border-subtle: var(--gray-700); --border-strong: var(--gray-550); --border-emphasis: var(--gray-300);
  --text-primary: var(--gray-300); --text-secondary: var(--gray-400);
  --text-meta: var(--gray-500); --text-disabled: var(--gray-600);

  --status-complete: #6BFFDC; --status-progress: #FF8559; --status-failed: #FF98F4;
  --status-active: #FEFF34; --status-info: #D2B3ED; --status-live: #A74CEE;
  --axis-x: #F04438; --axis-y: #2E90FA; --axis-z: #12B76A;
  --scene-beam: #F79009; --scene-range: #D0D5DD;
  --tint-emphasis: rgba(208,213,221,0.18); --tint-emphasis-s: rgba(208,213,221,0.08);
  --ring-emphasis: rgba(208,213,221,0.65); --scrim: rgba(16,24,40,0.82);
  --elev-3: 0 12px 24px rgba(16,24,40,0.50);

  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-10: 10px;
  --space-12: 12px; --space-16: 16px;
  --radius-xs: 3px; --radius-sm: 5px; --radius-card: 8px; --radius-pill: 999px;

  --font: "Inter", system-ui, -apple-system, sans-serif;
  --t-body-m: 400 12px/18px var(--font);
  --t-body-s: 400 10.5px/16px var(--font);
  --t-label-m: 500 10.5px/14px var(--font); --tr-label-m: 0.07em;
  --t-label-s: 500 9.5px/13px var(--font);  --tr-label-s: 0.09em;
  --t-mono: 500 10.5px/14px ui-monospace, "SF Mono", Menlo, monospace;

  /* the one column width the ruler and every lane have to agree about, or the
     ticks stop lining up with the clips they are measuring */
  /* THE PINNED COLUMN: badge, name, frame, blend, eye, delete. It was sized when there
     were two buttons on a row and there are now up to four — so the filename between them
     had been squeezed to about a character and a half, which is not a name, it is a
     rounding error. Widened to fit what the row actually carries. The name is still the
     first thing to give ground when it has to: the clip's name is on its block as well. */
  --gutter: 184px;
  --lane-h: 32px;
  --gbar-h: 24px;           /* the sequence's own bar, on the timeline */
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--surface-panel); color: var(--text-primary); font: var(--t-body-m);
  overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased;
}
.app { height: 100%; display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-8); }

.bar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-4) var(--space-6); flex: 0 0 auto; }
.btn {
  font: var(--t-label-m); letter-spacing: var(--tr-label-m); color: var(--text-secondary);
  background: transparent; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  padding: 0 var(--space-8); height: 22px; display: inline-flex; align-items: center; gap: var(--space-4);
  cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-strong); }
.btn.on { color: var(--gray-900); background: var(--text-primary); border-color: var(--text-primary); }
.btn:disabled { color: var(--text-disabled); cursor: default; border-color: var(--border-subtle); }
.btn.cta { color: var(--gray-900); background: var(--status-complete); border-color: var(--status-complete); }
.btn.cta:disabled { color: var(--text-disabled); background: transparent; border-color: var(--border-subtle); }
.btn.danger:hover:not(:disabled) { color: var(--status-failed); border-color: var(--status-failed); }
.sep { width: 1px; height: 16px; background: var(--border-subtle); margin: 0 var(--space-2); flex: 0 0 auto; }
.grow { flex: 1 1 auto; }

.st { font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-meta); display: inline-flex; align-items: center; gap: var(--space-4); }
.st b { color: var(--text-secondary); font-weight: 600; }
.st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--text-disabled); }
.st.live::before { background: var(--status-complete); }
.st.alone::before { background: var(--status-active); }

.time { font: var(--t-mono); color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.time i { color: var(--text-meta); font-style: normal; }
.len { font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-meta); cursor: ew-resize; white-space: nowrap; padding: 0 var(--space-2); }
.len b { color: var(--text-secondary); font: var(--t-mono); }

/* ---------- THE SEQUENCE BAR ----------
   The whole point of the grouping made visible: which cue is being edited, what
   it is thrown at, and the three things you do to a cue. Given its own row and
   its own ground rather than folded into the transport, because "which sequence
   am I in" is the question the panel exists to keep answered. */
.seqbar { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap;
  gap: var(--space-4) var(--space-6); padding: var(--space-6) var(--space-8);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
  background: var(--surface-canvas); }
.seqbar .k { font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-disabled); }
/* the name is the control: click it to switch sequence, double-click to rename */
.seqpick { display: inline-flex; align-items: center; gap: var(--space-6); cursor: pointer;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 0 var(--space-6); height: 24px; background: var(--surface-raised); max-width: 260px; }
.seqpick:hover { border-color: var(--border-emphasis); }
.seqpick b { font: var(--t-label-m); letter-spacing: var(--tr-label-m); text-transform: uppercase;
  color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seqpick .caret { color: var(--text-meta); font-size: 9px; }
.seqpick .n { font: var(--t-mono); color: var(--text-disabled); }
#seqname { font: var(--t-label-m); letter-spacing: var(--tr-label-m); text-transform: uppercase;
  color: var(--text-primary); background: var(--surface-canvas); border: 1px solid var(--border-emphasis);
  border-radius: var(--radius-sm); height: 24px; padding: 0 var(--space-6); width: 200px; outline: none; }

/* the route chip: a sequence with nowhere to go is the commonest broken cue there
   is, so it is stated at sequence level and coloured when it is answered */
.route { display: inline-flex; align-items: center; gap: var(--space-4);
  font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-meta); background: transparent; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); height: 24px; padding: 0 var(--space-8); cursor: pointer; max-width: 220px; }
.route:hover { color: var(--text-primary); border-color: var(--border-strong); }
.route.on { color: var(--status-complete); border-color: var(--status-complete); }
.route b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- the timeline ----------
   ONE SCROLLER, BOTH AXES. Zoom made the content wider than the panel, and the
   alternative — two scrollers kept in step, one for the ruler and one for the
   lanes — is a synchronisation bug waiting to be written. So the ruler, the group
   headers and every lane live in one grid that scrolls as a unit, and the two
   things that must not scroll away are pinned with `position: sticky`: the ruler
   to the top, the name gutter to the left. Native scrolling, native scrollbars,
   nothing to keep in step. */
.tl { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
  background: var(--surface-canvas); overflow: hidden; }
.hscroll { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
.hscroll::-webkit-scrollbar { width: 9px; height: 9px; }
.hscroll::-webkit-scrollbar-thumb { background: var(--surface-raised); border-radius: 5px; }
.hscroll::-webkit-scrollbar-thumb:hover { background: var(--surface-emphasis); }
.hscroll::-webkit-scrollbar-corner { background: transparent; }
/* as wide as the show is at the current zoom, and never narrower than the panel */
.hinner { position: relative; min-width: 100%; }

.ruler { position: sticky; top: 0; z-index: 6; height: 22px;
  background: var(--surface-canvas); border-bottom: 1px solid var(--border-subtle); }
.ruler .tk { position: absolute; top: 3px; font: var(--t-label-s); letter-spacing: var(--tr-label-s);
  color: var(--text-disabled); padding-left: 3px; border-left: 1px solid var(--border-subtle);
  height: 16px; pointer-events: none; white-space: nowrap; }
/* the gutter's own corner, over the ruler, so ticks do not slide out from behind
   the names when the lanes are scrolled left */
.ruler .corner { position: sticky; left: 0; z-index: 2; display: block; width: var(--gutter);
  height: 100%; background: var(--surface-canvas); border-right: 1px solid var(--border-subtle); }
.loopbar { position: absolute; top: 0; bottom: 0; border-radius: var(--radius-xs);
  background: var(--tint-emphasis-s); border: 1px solid var(--border-subtle); cursor: grab; z-index: 1; }
.loopbar.on { background: rgba(167,76,238,0.22); border-color: var(--status-live); }
.loopbar i { position: absolute; top: 0; bottom: 0; width: 6px; cursor: ew-resize; }
.loopbar i.a { left: -3px; } .loopbar i.b { right: -3px; }
.loopbar i::after { content: ''; position: absolute; top: 4px; bottom: 4px; left: 2px; width: 2px;
  background: var(--border-strong); border-radius: 1px; }
.loopbar.on i::after { background: var(--status-live); }

/* ---------- A SEQUENCE, AS A BLOCK ----------
   Every sequence in the take is on screen at once, so what has to be unmissable is
   where one cue ends and the next begins. Four signals, because one is not enough
   when there are six of them:

     THE BAR.   A container that STRETCHES the full length of the cue's content —
                from its first frame to its last — carrying the name, the output and
                the cue point. It is the sequence, as an object you can see and pick
                up: dragging it moves the whole cue in time, folded or open.
     A SPINE.   The same accent down the pinned gutter, so which cue a lane belongs
                to survives being scrolled and zoomed.
     GUIDES.    Faint dashed verticals at every sequence's head and tail, drawn the
                full height of the panel behind everything — which is what makes
                "does this land where that one ends" a thing you can SEE.
     FOCUS.     The one being edited is lit; the others dim to about 60%. Dimmed,
                not hidden: seeing ACT TWO run into ACT THREE is why they stack. */
.grp { position: relative; }
.grp + .grp { margin-top: var(--space-4); }
.grp.cur { background: rgba(255,255,255,0.022); }
.grp:not(.cur) { opacity: 0.62; }
/* SELECTED AS A WHOLE, which is a different statement from "this is the cue being
   edited": `.cur` says where your edits land, `.seqsel` says the cue ITSELF is the
   thing selected — which is what makes CROP SEQUENCE the gesture rather than a state
   you fall into by having nothing highlighted. */
.grp.seqsel { background: rgba(255,255,255,0.055); box-shadow: inset 2px 0 0 var(--seq); }
.grp:not(.cur):hover { opacity: 0.86; }

/* the header row: a narrow pinned stub, then the bar itself out on the timeline */
.grow { display: flex; align-items: stretch; height: var(--gbar-h); }
.gstub { position: sticky; left: 0; z-index: 5; flex: 0 0 var(--gutter);
  display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-6) 0 var(--space-8);
  background: var(--surface-canvas); border-left: 4px solid var(--seq);
  border-right: 1px solid var(--border-subtle); border-top-left-radius: var(--radius-sm); }
.gstub .fold { font: var(--t-mono); font-size: 9px; color: var(--text-meta); cursor: pointer;
  width: 12px; text-align: center; flex: 0 0 auto; }
.gstub .fold:hover { color: var(--text-primary); }
.gstub .n { font: var(--t-mono); font-size: 9px; color: var(--text-disabled); flex: 0 0 auto; }
.gstub .gbtn { font: var(--t-mono); font-size: 9px; color: var(--text-disabled); cursor: pointer;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-xs); padding: 0 3px; flex: 0 0 auto; }
.gstub .gbtn:hover { color: var(--text-primary); border-color: var(--border-strong); }
.gstub .gbtn.on { color: var(--gray-900); background: var(--status-active); border-color: var(--status-active); }

.glane { position: relative; flex: 1 1 auto; min-width: 0; }
/* THE BAR. Its width is the cue's own length, so a short sting looks like a short
   sting next to a ten-minute act — which is the whole reason it is drawn out here
   instead of being a label in a gutter. */
.gbar { position: absolute; top: 2px; bottom: 2px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--seq) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--seq) 70%, transparent);
  display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-6);
  cursor: grab; overflow: hidden; min-width: 26px; }
.gbar:active { cursor: grabbing; }
.grp.cur .gbar { background: color-mix(in srgb, var(--seq) 26%, transparent); }
.gbar b { font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.gbar .out { font: var(--t-mono); font-size: 9px; color: var(--text-secondary);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-xs); padding: 0 3px;
  flex: 0 0 auto; white-space: nowrap; }
.gbar .out.on { color: var(--status-complete); border-color: rgba(107,255,220,0.45); }
.gbar .len { font: var(--t-mono); font-size: 9px; color: var(--text-meta); flex: 0 0 auto; margin-left: auto; }
/* the name, edited in place on the bar */
.gbar input { font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-primary); background: var(--surface-canvas); border: 1px solid var(--border-emphasis);
  border-radius: var(--radius-xs); height: 16px; padding: 0 3px; width: 120px; outline: none; min-width: 0; }

/* ---------- THE CUE ----------
   Where the cue is CALLED, which is not the same as where its first frame is: an
   operator hits GO on a number, and the number is what appears in a running order.
   Dropped on the bar, dragged along it, and it carries the sequence with it. */
.cue { position: absolute; top: -1px; bottom: -1px; width: 0; z-index: 6; pointer-events: none; }
.cue i { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--status-active); }
.cue b { position: absolute; top: 1px; left: 3px; font: var(--t-mono); font-size: 9px;
  color: var(--gray-900); background: var(--status-active); border-radius: 2px; padding: 0 3px;
  white-space: nowrap; pointer-events: auto; cursor: ew-resize; }
.cue.sel b { box-shadow: 0 0 0 2px var(--border-emphasis); }

/* ---------- THE GUIDES ----------
   Behind everything, full height, dashed and deliberately faint: they are for
   lining things up against, not for reading. */
.guides { position: absolute; left: var(--gutter); top: 0; bottom: 0; right: 0;
  pointer-events: none; z-index: 0; overflow: hidden; }
.guides .g { position: absolute; top: 0; bottom: 0; width: 0;
  border-left: 1px dashed rgba(162,171,186,0.16); }
.guides .g.tail { border-left-style: dashed; border-left-color: rgba(162,171,186,0.10); }

.rows { position: relative; z-index: 1; }
.row { display: flex; align-items: stretch; height: var(--lane-h);
  border-bottom: 1px solid rgba(52,64,84,0.4); }
.row.sel .name { background: var(--surface-raised); }
.row.firstaudio { border-top: 1px solid rgba(98,116,142,0.5); }
.row.hidden .lane { opacity: 0.28; }
/* a layer you can pick up says so, and where it will land is drawn on the row it
   will land against rather than guessed at from the cursor */
.row .name[data-lift] { cursor: grab; }
.row .name[data-lift]:active { cursor: grabbing; }
.row.dragging { opacity: 0.4; }
.row.dropabove { box-shadow: inset 0 2px 0 0 var(--status-complete); }
.row.dropbelow { box-shadow: inset 0 -2px 0 0 var(--status-complete); }
/* A WHOLE CUE BEING MOVED. Heavier than a layer's line because it is a heavier move —
   every layer in it goes — and it has to read against the cue's own accent bar. */
.grp.dropabove { box-shadow: inset 0 3px 0 0 var(--status-complete); }
.grp.dropbelow { box-shadow: inset 0 -3px 0 0 var(--status-complete); }
.grp.dragging { opacity: 0.5; }
.grow[data-seqhead] { cursor: grab; }
.grow[data-seqhead]:active { cursor: grabbing; }

.name { position: sticky; left: 0; z-index: 3; flex: 0 0 var(--gutter); min-width: 0;
  display: flex; align-items: center; gap: var(--space-4);
  padding: 0 var(--space-4) 0 var(--space-6); background: var(--surface-canvas);
  border-left: 4px solid var(--seq); border-right: 1px solid var(--border-subtle);
  cursor: pointer; overflow: hidden; }
.grp .row:last-child .name { border-bottom-left-radius: var(--radius-sm); }
/* ---------- THE TRACK BADGE ----------
   TWO FACTS IN ONE MARK, and they were fighting over the same colour. The badge
   said V1 or A1 in violet or mint — but violet and mint are also the accents two
   SEQUENCES might be wearing, so a lane's colour meant "this is video" in one
   group and "this is ACT TWO" in the next. Colour now belongs to the SEQUENCE
   alone, everywhere, and the video/audio distinction is carried by a SHAPE: a
   frame for picture, a wave for sound. A shape survives being tinted; a colour
   does not survive being asked two questions. */
.kind { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px;
  font: var(--t-mono); font-size: 9.5px; border-radius: var(--radius-xs);
  padding: 1px 4px 1px 3px; border: 1px solid var(--seq); color: var(--seq); }
.kind svg { width: 9px; height: 9px; display: block; fill: currentColor; flex: 0 0 auto; }
/* the top video layer is the picture: filled, in the cue's own colour */
.kind.top { color: var(--gray-900); background: var(--seq); border-color: var(--seq); }
/* audio sits under the picture and says so by being quieter, not by being a
   different colour — it is the same cue */
.kind.a { opacity: 0.72; border-style: dashed; }
.name > span.t { min-width: 0; flex: 1 1 auto; font: var(--t-body-s); color: var(--text-disabled);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.sel .name > span.t { color: var(--text-secondary); }
/* the things you do to a layer: stop looking at it, change how it mixes, hand its frame
   back, or get rid of it.

   THEY WERE TOO QUIET TO FIND. Drawn in `--text-disabled` at 9px, the whole set read as
   greyed-out — the colour this system uses for a control that cannot be pressed — so the
   one row of buttons somebody uses on every layer looked like the one row they could not.
   `--text-meta` at rest is legible without competing with the cue's own accent, which is
   the thing on a row that IS allowed to shout. */
.tbtn2 { flex: 0 0 auto; width: 18px; height: 18px; display: inline-flex; align-items: center;
  justify-content: center; border-radius: var(--radius-xs); cursor: pointer;
  color: var(--text-meta); font: var(--t-mono); font-size: 9.5px; }
.tbtn2 svg { width: 13px; height: 13px; display: block; flex: 0 0 auto; }
.tbtn2:hover { color: var(--text-primary); background: var(--surface-emphasis); }
.tbtn2.off { color: var(--status-progress); }
.tbtn2.del:hover { color: var(--status-failed); }
/* THE BLEND TAG needs three characters where the others need one, so it is the one
   `tbtn2` that sizes to its content. Lit only when the layer is doing something — a row
   of NRM in accent ink would be four decisions shouting where none was made. */
.tbtn2.blend, .tbtn2.frame { width: auto; min-width: 22px; padding: 0 3px; letter-spacing: 0.02em; }
.tbtn2.frame.on { color: var(--status-progress); background: var(--surface-emphasis); }
.tbtn2.blend.on { color: var(--status-info); background: var(--surface-emphasis); }
.tbtn2.blend.off { color: var(--text-disabled); opacity: 0.5; }

.lane { position: relative; flex: 1 1 auto; min-width: 0; cursor: crosshair; }
.lane.over { background: var(--tint-emphasis-s); box-shadow: inset 0 0 0 1px var(--status-complete); }
.lane .empty { position: absolute; left: 0; top: 0; bottom: 0; display: flex; align-items: center;
  padding-left: var(--space-8); font: var(--t-body-s); color: var(--text-disabled);
  pointer-events: none; white-space: nowrap; }
.band { position: absolute; top: 0; bottom: 0; background: rgba(167,76,238,0.10);
  border-left: 1px solid rgba(167,76,238,0.5); border-right: 1px solid rgba(167,76,238,0.5);
  pointer-events: none; }

/* the snap line — where the thing in your hand has just locked to */
.snapline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--status-complete);
  z-index: 8; pointer-events: none; display: none; }
.snapline.on { display: block; }

/* ---------- a clip ----------
   The filmstrip is not decoration: a lane of identically-named grey blocks is
   unreadable at a glance. An audio clip gets its waveform for the same reason —
   it is the only thing that makes an audio lane usable for lining a hit up.
   The border takes the SEQUENCE'S accent, so a clip is legible as belonging to its
   cue even when the group header has been scrolled past. */
.clip { position: absolute; top: 3px; bottom: 3px; border-radius: var(--radius-xs);
  border: 1px solid var(--seq); background: var(--surface-raised);
  background-size: auto 100%; background-repeat: repeat-x; background-position: left center;
  display: flex; align-items: flex-end; overflow: hidden; cursor: grab; min-width: 3px; }
.clip.audio { background-size: 100% 100%; background-repeat: no-repeat;
  background-color: color-mix(in srgb, var(--seq) 10%, transparent); border-style: dashed; }
.clip .lab { position: relative; z-index: 1; font: var(--t-label-s); letter-spacing: var(--tr-label-s);
  color: var(--text-primary); text-transform: uppercase; padding: 1px var(--space-6) 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
  background: linear-gradient(to top, rgba(16,24,40,0.92), rgba(16,24,40,0.0)); }
.clip.sel { box-shadow: 0 0 0 1px var(--ring-emphasis); border-color: var(--border-emphasis); }
.clip.live { box-shadow: 0 0 0 1px var(--status-live); }
.clip.live .lab { color: #fff; }
.clip .h { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 2; }
.clip .h.a { left: 0; } .clip .h.b { right: 0; }
.clip:hover .h::after { content: ''; position: absolute; top: 3px; bottom: 3px; left: 2px; width: 2px;
  background: var(--border-emphasis); border-radius: 1px; }
.clip.trim::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--status-progress); z-index: 1; }

/* ---------- THE FADES ----------
   Drawn as a wedge of darkness over the clip's own ends, because that is what a
   fade IS — the picture on its way to or from nothing. An SVG rather than a CSS
   gradient so the EASING is a real curve you can see the shape of: a linear ramp
   and an S-curve look different and behave differently, and a control whose effect
   you cannot see is a control nobody will touch twice.

   Two grips per fade: the one on the top edge sets its LENGTH, the one on the
   curve sets its SHAPE. Dragging the second one up makes the picture hold and
   then drop; down makes it leave immediately and linger. */
.fades { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.fades path { fill: rgba(16,24,40,0.72); }
/* THE GRIPS ARE ALWAYS THERE. They were revealed on hover, which meant the whole
   fade feature was invisible until somebody happened to put a pointer on a clip and
   look at its top corners — a control nobody can see is a control that does not
   exist. They are small, they sit in the corners where a fade starts and ends, and
   they are shaped like what they make: a wedge. */
.fgrip { position: absolute; z-index: 3; width: 0; height: 0; cursor: ew-resize;
  border-style: solid; opacity: 0.75; }
.fgrip:hover { opacity: 1; }
.fgrip.in { top: 0; border-width: 9px 0 0 9px; margin-left: -9px;
  border-color: transparent transparent transparent var(--border-emphasis); }
.fgrip.out { top: 0; border-width: 9px 9px 0 0;
  border-color: var(--border-emphasis) transparent transparent transparent; }
.clip.sel .fgrip, .clip:hover .fgrip { opacity: 1; }
.fgrip.ease { cursor: ns-resize; border: 1px solid var(--status-active); border-radius: 50%;
  background: var(--status-active); width: 7px; height: 7px; margin-left: -3px; margin-top: -3px;
  border-width: 1px; }

/* ---------- THE FADE ACTIONS, ON THE CLIP ----------
   Dragging a corner is the fine control. These are the coarse one, and the reason
   they exist is that "put a one-second fade on this" should not require anybody to
   discover a 9px triangle first. They appear on the selected clip, on the clip, and
   they are the whole vocabulary: up, down, and across to the layer underneath. */
.acts { position: absolute; left: 50%; transform: translateX(-50%); top: 2px; z-index: 4;
  display: none; gap: 2px; }
.clip.sel .acts { display: flex; }
.acts button { font: var(--t-mono); font-size: 9px; line-height: 1; color: var(--text-primary);
  background: rgba(16,24,40,0.9); border: 1px solid var(--border-strong); border-radius: var(--radius-xs);
  padding: 2px 4px; cursor: pointer; white-space: nowrap; }
.acts button:hover { border-color: var(--border-emphasis); background: var(--surface-raised); }
.acts button.x { color: var(--status-active); border-color: rgba(254,255,52,0.5); }
.acts button:disabled { color: var(--text-disabled); border-color: var(--border-subtle); cursor: default; }
/* where two layers overlap and are cross-faded, the region is marked on the lane —
   a crossfade is a fact about two clips and belongs to neither of them alone */
.xf { position: absolute; top: 0; bottom: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(45deg, rgba(254,255,52,0.10) 0 4px, transparent 4px 8px);
  border-left: 1px solid rgba(254,255,52,0.45); border-right: 1px solid rgba(254,255,52,0.45); }

/* the playhead spans every group — one clock for the whole take, and seeing it
   cross from one cue into the next is the point of stacking them. Its head is a
   grab handle: scrubbing by dragging the thing itself is what a hand reaches for
   before it thinks about the ruler. */
.head { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--status-active);
  z-index: 7; pointer-events: none; }
.head i { position: absolute; top: 0; left: -7px; width: 14px; height: 14px; cursor: ew-resize;
  pointer-events: auto; }
.head i::before { content: ''; position: absolute; top: 0; left: 3px;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 6px solid var(--status-active); }
.head i:hover::before { border-top-color: #fff; }
.head.grab i::before { border-top-color: #fff; }

/* ---------- zoom ---------- */
.zoom { display: inline-flex; align-items: center; gap: var(--space-2); flex: 0 0 auto; }
.zoom .btn { padding: 0 var(--space-6); min-width: 22px; justify-content: center; }
.zoom .lvl { font: var(--t-mono); font-size: 9.5px; color: var(--text-meta); min-width: 46px;
  text-align: center; cursor: ew-resize; white-space: nowrap; }

.none { padding: var(--space-16); font: var(--t-body-s); color: var(--text-disabled); }
.none b { color: var(--text-secondary); font-weight: 600; }

.foot { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-6); flex-wrap: wrap; }
.chip { font: var(--t-label-s); letter-spacing: var(--tr-label-s); text-transform: uppercase;
  color: var(--text-meta); border: 1px solid var(--border-subtle); border-radius: var(--radius-pill);
  padding: 1px var(--space-8); white-space: nowrap; }
.chip b { color: var(--text-secondary); font-weight: 600; }
.chip.warn { color: var(--status-progress); border-color: var(--status-progress); }
.chip.ok { color: var(--status-complete); border-color: var(--status-complete); }

.menu { position: fixed; z-index: 40; min-width: 200px; max-height: 320px; overflow: auto;
  background: var(--surface-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-card);
  box-shadow: var(--elev-3); padding: var(--space-4); display: none; flex-direction: column; }
.menu.open { display: flex; }
.menu .k { font: var(--t-label-s); letter-spacing: var(--tr-label-s); color: var(--text-meta);
  text-transform: uppercase; padding: var(--space-6) var(--space-8) var(--space-4); }
.menu button { font: var(--t-body-s); color: var(--text-primary); background: transparent; border: 0;
  text-align: left; padding: var(--space-6) var(--space-8); border-radius: var(--radius-sm); cursor: pointer;
  display: flex; justify-content: space-between; gap: var(--space-8); align-items: baseline; }
.menu button:hover { background: var(--surface-selected); }
.menu button.on { color: var(--gray-900); background: var(--text-primary); }
.menu button.on i { color: var(--gray-800); }
.menu button i { font-style: normal; color: var(--text-meta); font: var(--t-mono); }

.toast { position: fixed; left: 50%; bottom: var(--space-12); transform: translateX(-50%);
  background: var(--surface-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
  padding: var(--space-4) var(--space-12); font: var(--t-body-s); color: var(--text-primary);
  box-shadow: var(--elev-3); opacity: 0; transition: opacity 0.18s; pointer-events: none; z-index: 50;
  max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; }

.dev { display: none; flex: 0 0 auto; max-height: 84px; overflow: auto;
  border-top: 1px solid var(--border-subtle); padding-top: var(--space-4); }
.dev.on { display: block; }
.dev .l { font: var(--t-mono); font-size: 9.5px; color: var(--text-disabled); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.dev .l.out { color: var(--text-meta); }
</style>
</head>

<script>
/* ==========================================================================
   0 · THE WIRE — SCENE-STUDY-BRIDGE.md, version 1.
   ========================================================================== */
const BRIDGE_V = 1;
const EMBEDDED = window.parent !== window;
const MODE = 'timeline';
const HOST = { unitsPerMetre: 10 };

const post = (type, body, transfer) => {
  const msg = Object.assign({ v: BRIDGE_V, type, mode: MODE }, body || {});
  if (EMBEDDED) window.parent.postMessage(msg, '*', transfer || []);
  devLog('out', type, body);
};

/* ==========================================================================
   1 · STATE
   ========================================================================== */
const S = {
  takeId: null,
  tracks: [],            // the take's sequence objects, as the take states them
  targets: [],           // routable surfaces, from the room
  seqs: [],              // the grouping — see below
  cur: null,             // the sequence being worked on
  clips: new Map(),      // clipId -> clip  (see `clipsOn`)
  sel: null,             // the track LOAD targets
  selClip: null,
  /* WHAT DELETE WILL DELETE. One focus at a time, and it says which kind of thing
     it is on — a key that removes "the selection" when three different things can
     be selected is a key nobody will press twice. */
  focus: null,           // { kind: 'clip'|'track'|'cue', id }
  live: false,
};
/*  A SEQUENCE is
      { id, name, route, crop, tracks: [{ trackId, kind:'video'|'audio' }] }
    `tracks` is ORDERED, and for video that order is the layer stack: last is on
    top; each entry also carries `hidden`, which takes a layer out of the picture
    without deleting it. `route` and `crop` are the sequence's, which is the whole
    point — a wall shows one picture and the picture is what the cue cuts together.
    `cue` is where the cue is CALLED: `{ at, label }`.

    A CLIP is
      { id, trackId, name, kind, dur, in, out, start, fadeIn, fadeOut, easeIn,
        easeOut, video, strip, bytes }
    The fades are LENGTHS in seconds off each end, and the eases are the shape of
    each ramp: 0.5 is a straight line, above holds and then drops, below leaves at
    once and lingers. A crossfade is not a third thing — it is V2 fading out over a
    V1 that is still running, which is exactly what it is on a real rig.
    `dur` is the FILE; `in`/`out` are the part that plays; `start` is where that
    part sits on the show's clock. Length on the lane is out - in. */
const T = {
  playing: false, t: 0, span: 60, autoSpan: true,
  loop: false, loopIn: 0, loopOut: null, unit: 's',
};
const loopOut = () => (T.loopOut === null ? T.span : Math.min(T.loopOut, T.span));
const clipLen = (c) => {
  const len = (c.out || c.dur || 0) - (c.in || 0);
  return isFinite(len) && len > 0 ? Math.max(0.05, len) : 0;
};
const clipEnd = (c) => c.start + clipLen(c);
/* ==========================================================================
   A LANE HOLDS SEVERAL CLIPS, ONE AFTER ANOTHER.

   It used to hold exactly one, and dropping a second file replaced the first — which
   made a lane a slot rather than a track, and meant a two-shot sequence needed two
   layers stacked on top of each other to say something that is not about layering at
   all. A cut is two clips in a ROW.

   THEY ARE CONSECUTIVE, NEVER SIMULTANEOUS (see `deOverlap`). A lane is one layer: it
   has one blend mode, one frame on the wall, one place in the stack. Two of its clips
   running at once could only fight over those, and fighting over them is precisely what
   a second layer is for. So a lane is a running order, and the stack is the other axis.

   THE FIRST CLIP ON A LANE IS KEYED BY THE LANE'S OWN ID, and later ones by that id
   plus a counter. Not decoration: the take's media store, the room, the monitor and the
   Content Bin all addressed clips by track id, and this way every one of those keeps
   working for the clip they were talking about while the new ones simply arrive as ids
   they have not seen. A message with no `clipId` still means "the first clip on that
   lane", which is what it meant before.
   ========================================================================== */
const CLIP_SEP = '~';
/* clip ids already asked for and not yet arrived — two drops in quick succession must
   not both claim the same one, and the bytes of the first are still in flight */
const binWaiting = new Set();
/* every clip on a lane, in the order they play */
const clipsOn = (trackId) => [...S.clips.values()]
  .filter(c => c.trackId === trackId).sort((a, b) => a.start - b.start);
/* the one that stands for the lane where only one can be named — the first */
const laneClip = (trackId) => clipsOn(trackId)[0] || null;
const clipAtTime = (trackId, at) =>
  clipsOn(trackId).find(c => at >= c.start && at < clipEnd(c)) || null;
/* what the lane is showing, or failing that what it is: the crop handles and the
   take's own record want the picture that is actually up */
const laneClipNow = (trackId) => clipAtTime(trackId, T.t) || laneClip(trackId);
const laneEnd = (trackId) => clipsOn(trackId).reduce((m, c) => Math.max(m, clipEnd(c)), 0);
/* where a new clip on this lane goes: the end of the lane, or the place a claim asked
   for. The wish is spent once — a second clip on that lane butts up against the first
   like any other. */
function startWanted(trackId) {
  if (wantStart.has(trackId) && !clipsOn(trackId).length) {
    const at = wantStart.get(trackId);
    wantStart.delete(trackId);
    return Math.max(0, at || 0);
  }
  return laneEnd(trackId);
}
const newClipId = (trackId) => {
  const taken = (id) => S.clips.has(id) || binWaiting.has(id);
  if (!taken(trackId)) return trackId;
  let n = 2;
  while (taken(trackId + CLIP_SEP + n)) n++;
  return trackId + CLIP_SEP + n;
};
/* WHOSE LANE A CLIP ID BELONGS TO. From the record where there is one — the split is
   only for an id that has arrived from outside and has no clip here yet. */
const trackOfClipId = (clipId) => {
  const c = S.clips.get(clipId);
  if (c) return c.trackId;
  const i = String(clipId).indexOf(CLIP_SEP);
  return i < 0 ? String(clipId) : String(clipId).slice(0, i);
};
/* ---------- SLIDING A CLIP CLEAR OF ITS NEIGHBOURS ----------
   Run when a drag or a trim ends rather than while it moves: shoving the block out from
   under the pointer mid-gesture is how a timeline starts feeling haunted. It goes to
   whichever side it came from — the halves it sits past decide — so pushing a clip left
   into its neighbour butts it up against that neighbour's head, and pushing right butts
   it against the tail. */
/* THE ROOM A CLIP HAS ON ITS OWN LANE — from the tail of the clip before it to the
   head of the one after. A TRIM is bounded by it: pulling a tail into the next shot is
   not something to resolve afterwards, it is something the handle should refuse. A MOVE
   is NOT bounded by it, because dragging a shot past its neighbour to reorder the two is
   the ordinary thing to want; that is what `deOverlap` settles on release. */
function laneGap(c) {
  let lo = 0, hi = Infinity;
  clipsOn(c.trackId).forEach(x => {
    if (x === c) return;
    if (clipEnd(x) <= c.start + 0.001) lo = Math.max(lo, clipEnd(x));
    else if (x.start >= clipEnd(c) - 0.001) hi = Math.min(hi, x.start);
  });
  return { lo, hi };
}
function deOverlap(c) {
  const sibs = clipsOn(c.trackId).filter(x => x !== c);
  let moved = false;
  for (let pass = 0; pass <= sibs.length; pass++) {
    const hit = sibs.find(x => c.start < clipEnd(x) - 0.001 && clipEnd(c) > x.start + 0.001);
    if (!hit) return moved;
    const mid = (x) => x.start + clipLen(x) / 2;
    c.start = mid(c) >= mid(hit) ? clipEnd(hit) : Math.max(0, hit.start - clipLen(c));
    moved = true;
  }
  return moved;
}
/* ---------- HOW FAR A CLIP'S TAIL CAN GO ----------
   For a movie it is the end of the file: there are no frames past it, and letting
   somebody drag a tail into nothing would be a block on the lane playing black.

   FOR A STILL THERE IS NO SUCH LIMIT. A still has no length of its own — five
   seconds was a default, not a fact — and "hold this slate until the band comes
   on" is the ordinary thing to want from one. So its tail is free, and the five
   seconds it arrives with is just where it starts. */
const STILL_MAX = 3600;
const outMax = (c) => c.kind === 'image' ? STILL_MAX : (c.dur || 0);

const el = (id) => document.getElementById(id);
const mmss = (s) => {
  s = Math.max(0, s || 0);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + (s % 60).toFixed(1).padStart(4, '0');
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (m) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
let toastT = 0;
function toast(msg) {
  const t = el('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- the sequence, and what is in it ---------- */
const curSeq = () => S.seqs.find(q => q.id === S.cur) || null;
const seqOfTrack = (trackId) => S.seqs.find(q => q.tracks.some(t => t.trackId === trackId)) || null;
/* ---------- WHICH LAYER HAS NOTHING UNDER IT ----------
   It used to be "the first video row in this cue", which was true while a wall could
   only ever be fed by one cue. Cues are stacked now (see `prioOf`), so two of them
   thrown at one surface are ONE stack over there — and a cue sitting on top of another
   has nothing inert about its bottom layer: it mixes with the cue beneath it. Marking it

           from under the pointer, which is why layers stopped answering a click at all.

           So: our own gesture is recorded AND re-broadcast, because the cue's other layers
           have to follow it. Anything else is adopted quietly and goes no further — it has
           already been applied wherever it was decided, and a second opinion about it is
           not worth a storm. */
        /* ---------- A GROUP CROP IS KEPT AS IT WAS DRAGGED ----------
           A sequence crop moves EVERY layer, and the room reports where each of them
           ended up. Taking only the handle-owner's row and re-deriving the others is what
           broke the dimensions on confirmation — so every row of a group gesture is kept,
           onto its own track, exactly as reported. The cue's crop is recorded too, from
           the layer the handles were on, but only as what a layer added later inherits.

           The rows cannot fight each other here the way they used to: each one writes its
           OWN track and nothing else, so there is no shared value for two of them to
           disagree about. */
        const armedGroup = cropArmed && cropArmed.level === 'sequence';
        const armedHere = cropArmed && cropArmed.trackId === row.trackId;
        const settled = q && sameCropish(cropFor(q, row.trackId), row.crop);
        if (q && armedGroup) {
          const t = (q.tracks || []).find(x => x.trackId === row.trackId);
          if (t) t.crop = { ...row.crop };
          if (armedHere) q.crop = { ...row.crop };
          cropTouched = true;
        } else if (q && armedHere) {
          const t = (q.tracks || []).find(x => x.trackId === row.trackId);
          if (t) t.crop = { ...row.crop };
          cropTouched = true;
        } else if (q && !cropArmed && !settled) {
          /* a crop decided somewhere else — the room's own crop bar, a clip dropped
             straight onto a wall — adopted so this panel agrees, and NOT republished */
          q.crop = { ...row.crop };
        }
      }
    });
    reSpan(); build();
    /* AND EVERY OTHER LAYER IS TOLD, which is the whole of the bug. A crop dragged on the
       wall arrives here as ONE clip's crop; recording it and stopping meant the rest of
       the cue was still carrying whatever crop it had before, so cropping the cue moved
       exactly one layer. Republishing hands all of them the composed result.

       Safe against a loop: the host never echoes a panel its own message, and the room's
       inbound `clips` applies and does not report back. */
    if (cropTouched) {
      /* THE GESTURE IS OVER. A stale arming would reinterpret the next crop the room
         authors on its own — a clip dropped onto a wall, a canvas unlinked — as a
         decision about a layer that nobody was touching. */
      cropArmed = null;
      publishClips();
    }
  },
};

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.v !== BRIDGE_V || !IN[d.type]) return;
  devLog('in', d.type, d);
  IN[d.type](d);
});

function applyTokens(tokens) {
  Object.entries(tokens).forEach(([k, v]) => {
    if (k.startsWith('--') && typeof v === 'string') document.documentElement.style.setProperty(k, v);
  });
}
const devLines = [];
function devLog(dir, type, body) {
  if (EMBEDDED) return;
  devLines.unshift('<div class="l ' + dir + '">' + (dir === 'out' ? '→ ' : '← ') + type + ' '
    + (body ? JSON.stringify(body, (k, v) => v instanceof ArrayBuffer ? '[' + v.byteLength + ' bytes]' : v).slice(0, 190) : '') + '</div>');
  devLines.length = Math.min(devLines.length, 40);
  el('dev').innerHTML = devLines.join('');
}

/* ==========================================================================
   3 · THE GROUPING
   A take that has tracks and no sequences is a take from before sequences
   existed, or one whose tracks were added by the checklist. Either way the
   tracks are real and they have to be somewhere, so they land in the first
   sequence rather than being invisible — losing a lane is worse than guessing.
   ========================================================================== */
let seqSeq = 0;
const newSeqId = () => 'q' + (++seqSeq) + Math.random().toString(36).slice(2, 6);

/* ---------- AND NOT BEFORE THE REPLAY ARRIVES ----------
   The handshake order is `hello`, `scene`, the assets, then `clips`. `scene` is
   what calls `ensureSequence`, and it lands FIRST — so a panel reopening on a take
   with six cues in it would build a default SEQUENCE 1, sweep every track into it,
   and then refuse the replay a moment later on the grounds that it already had a
   sequence. The collapse happened in the gap between two messages.

   So creating the first sequence waits for the grouping to be SETTLED: either the
   replay has landed, or enough time has passed that there plainly is not one. A
   take that has never had a timeline settles on the timer and behaves exactly as
   before; a take that has one settles on its own history. */
let restored = false, settled = !EMBEDDED;
function settleGrouping() {
  if (settled) return;
  settled = true;
  ensureSequence();
  adoptLooseTracks();
  build();
  /* now it may speak: whatever it has is either what it restored or the default cue
     it just built, and both are answers rather than an empty guess */
  publishGrouping();
}
/* HAS THIS TAKE EVER HAD A CUE. Not "does it have one now": the difference between a
   take nobody has sequenced yet and a take whose cues were all DELETED, which look
   identical from a list of length zero and want opposite things. The first should open on
   an empty cue; the second must stay empty, because somebody said so. Told by the host on
   the handshake — the take is what remembers — and true from the moment this panel
   publishes a grouping of its own. */
let cuedOnce = false;
function ensureSequence() {
  if (!settled) return;
  /* A TAKE OPENS ON AN EMPTY CUE. Making the first one conditional on there being tracks
     was a deadlock: + VIDEO is disabled without a sequence to add to, and the sequence was
     waiting for a track. An empty cue is also what a take IS — the show before anybody has
     put anything in it.

     ONCE, THOUGH. A cue deleted down to none is a decision, and putting SEQUENCE 1 back
     under somebody who has just removed it is the panel arguing with them. The timeline is
     allowed to hold no cues; + NEW is right there, and the empty state says so. */
  if (!S.seqs.length && !cuedOnce) {
    const q = { id: newSeqId(), name: 'SEQUENCE 1', route: null, crop: null,
                tracks: S.tracks.map(t => ({ trackId: t.id, kind: 'video' })) };
    S.seqs.push(q);
    cuedOnce = true;
    /* AND A LANE IN IT. A cue with no lanes has no `[data-lane]` to aim at, so on a take
       nobody had added a track to there was nothing in this panel a clip could be dropped
       ON — the bin's drag was fine, the drop target simply did not exist. `+ NEW` has
       always given its cue a lane for exactly this reason; the first cue was the one that
       did not, and the first cue is the one everybody meets. */
    if (!q.tracks.length) askTrack(q.id, 'video');
  }
  if (!S.cur || !S.seqs.some(q => q.id === S.cur)) S.cur = S.seqs.length ? S.seqs[0].id : null;
}
/* the grouping, as somebody else states it. Whole-sale on a fresh panel (see
   `clips`), field by field on a live one — because a live one may be mid-edit and
   only the FACTS need to move, not the scroll position or the selection. */
function reconcileGrouping(m) {
  const incoming = m.sequences || [];
  if (!S.seqs.length) return;                       // the restore path handles this
  const byId = new Map(S.seqs.map(q => [q.id, q]));
  const order = [];
  incoming.forEach(inc => {
    let q = byId.get(inc.id);
    if (!q) {
      q = { id: inc.id, name: inc.name, route: inc.route || null, crop: null, cue: null, tracks: [] };
      S.seqs.push(q);
    }
    /* the accent is adopted, never overwritten: whichever panel claimed it first is
       right, and a cue that already has one must not change colour under the hand */
    if (!Number.isInteger(q.tint) && Number.isInteger(inc.tint)) q.tint = inc.tint;
    q.name = inc.name;
    q.route = inc.route || null;
    if (q.route) q.routeCleared = false;
    if (inc.crop) q.crop = { ...inc.crop };
    q.cue = inc.cue ? { at: inc.cue.at, label: inc.cue.label } : null;
    /* track membership and layer order are the shape of the cue and travel whole —
       a lane added over there has to appear here, in the same place in the stack */
    const known = new Set(S.tracks.map(t => t.id));
    q.tracks = (inc.tracks || []).filter(t => known.has(t.trackId))
      .map(t => ({ trackId: t.trackId, kind: t.kind, hidden: !!t.hidden,
                     blend: BLEND_BY_KEY[t.blend] ? t.blend : 'normal',
                     /* THE TRACK'S OWN FRAME, if it has one. This rebuild replaces
                        `q.tracks` whole, so anything not carried here is lost — which is
                        exactly how the blend mode would have been lost too. */
                     crop: t.crop ? { ...t.crop } : null }));
    order.push(q.id);
  });
  /* a cue deleted in the other panel is deleted here: it is gone from the take */
  S.seqs = order.map(id => S.seqs.find(q => q.id === id)).filter(Boolean);
  if (m.cur && S.seqs.some(q => q.id === m.cur)) S.cur = m.cur;
  if (!S.seqs.some(q => q.id === S.cur)) S.cur = S.seqs.length ? S.seqs[0].id : null;
  /* the signature is now what the other panel published, so this one does not
     immediately republish it back as though it were its own change */
  groupSig = groupSigOf();
}

/* a track that belongs to no sequence — added by the checklist, or by DUPLICATE
   before its scene came back. `pending` claims them in the order they were asked
   for, which is the only ordering either side can agree on. */
const pending = [];        // [{ seqId, kind }]

/* ==========================================================================
   LANDING SOMETHING FROM THE BIN
   A drop had to hit a 32px lane of the right kind, and if the sequence had no
   video track — which is every new cue — there was nothing to hit at all. The
   thing being dragged already says what it is, and a cue that has no lane for it
   plainly needs one, so the lane is MADE rather than demanded.

   Three cases, in order of how specific the gesture was:
     ON A LANE      that lane, if it is the right kind for the file
     ON THE PANEL   a free lane of the right kind in this cue, if there is one
     NEITHER        a new lane of the right kind, asked of the take, and the file
                    lands on it when it arrives
   ========================================================================== */
const laneKindFor = (assetKind) => assetKind === 'audio' ? 'audio' : 'video';

function landAsset(a, trackId) {
  const want = laneKindFor(a.kind);
  /* NOTHING TO PUT IT IN IS NOT A REASON TO REFUSE IT. The timeline is allowed to hold no
     cues now (see `delSeq`), and "make a sequence first" is the panel asking somebody to
     perform the step it is about to perform anyway. The drop makes the cue, the cue gets
     the lane, the lane gets the file. */
  let q = curSeq();
  if (!q) {
    q = { id: newSeqId(), name: nextSeqName(), route: null, crop: null, tracks: [] };
    S.seqs.push(q); S.cur = q.id;
    build(); publishGrouping();
    toast(q.name + ' started for ' + a.name);
  }

  /* aimed at a lane: honour it, unless it is the wrong kind — a still and a movie
     both belong on video, a sound does not */
  if (trackId) {
    const row = (seqOfTrack(trackId) || { tracks: [] }).tracks.find(t => t.trackId === trackId);
    const lane = row ? row.kind : 'video';
    if (lane !== want) {
      toast(a.name + ' is ' + (want === 'audio' ? 'audio' : 'a picture')
            + ' — putting it on ' + (want === 'audio' ? 'an audio' : 'a video') + ' track instead');
    } else {
      return fetchInto(a, trackId);
    }
  }
  /* a free lane of the right kind, in the cue being edited */
  const free = rowsOf(q).find(r => r.kind === want && !laneClip(r.trackId));
  if (free) return fetchInto(a, free.trackId);

  /* none: make one. `askTrack` already knows how to wait for the take to answer,
     so the file is fetched in that callback rather than guessed at now. */
  toast('adding a ' + want + ' track for ' + a.name + '…');
  askTrack(q.id, want, (newId) => fetchInto(a, newId));
}
function fetchInto(a, trackId) {
  S.sel = trackId;
  /* THE ID IS CLAIMED NOW, not when the bytes land. The bin answers asynchronously and
     a lane can be dropped on twice before the first answer arrives — two answers with
     no ids between them would both be "the first clip on that lane" and one would
     replace the other. */
  const clipId = newClipId(trackId);
  binWaiting.add(clipId);
  post('binRequest', { assetId: a.assetId, trackId, clipId });
  build();
}
/* the same three cases for a FILE dropped from the desktop, which is the same
   gesture with the bytes already in hand */
function landFile(file) {
  const want = isAudioFile(file) ? 'audio' : 'video';
  /* same as `landAsset`: an empty timeline is a state to fill, not a reason to refuse */
  let q = curSeq();
  if (!q) {
    q = { id: newSeqId(), name: nextSeqName(), route: null, crop: null, tracks: [] };
    S.seqs.push(q); S.cur = q.id;
    build(); publishGrouping();
    toast(q.name + ' started for ' + file.name);
  }
  const free = rowsOf(q).find(r => r.kind === want && !laneClip(r.trackId));
  if (free) return loadFile(free.trackId, file);
  toast('adding a ' + want + ' track for ' + file.name + '…');
  askTrack(q.id, want, (newId) => loadFile(newId, file));
}
/* what the Content Bin put on the wire, whichever type survived the crossing */
function binPayload(dt) {
  if (!dt) return null;
  const a = dt.getData('application/x-productions-asset');
  if (a) return a;
  const t = dt.getData('text/plain') || '';
  return t.startsWith('productions-asset:') ? t.slice('productions-asset:'.length) : null;
}
/* v5.9.9 · A CUE THAT LANDS ON A WALL SHOULD SAY SO. Dropping a clip made it appear
   on the LED in the Scene Study while this panel still read OUTPUT NOT SET — because
   the scene was GUESSING the destination from its own local selection and telling
   nobody. Two panels, two answers, and the take held neither.

   So the guess becomes a DECISION, made here, where the output belongs and where it is
   displayed. It is only taken when the room leaves no doubt: one wall, or one surface
   of any kind. With two walls there is a real choice and assigning one of them would be
   worse than leaving it open — the chip already says NO OUTPUT SET and the picker is
   next to it.

   `routeCleared` is respected: choosing "— nowhere —" is an answer, not an absence, and
   nothing here may overturn it. */
function obviousRoute() {
  const surfaces = S.targets.filter(d => d.req === 'link' || d.req === 'led' || d.req === 'projectors');
  if (!surfaces.length) return null;
  const walls = surfaces.filter(d => d.req === 'link' || d.req === 'led');
  if (walls.length === 1) return walls[0].id;
  if (surfaces.length === 1) return surfaces[0].id;
  return null;
}
/* ---------- EVERY CUE ITS OWN SCREEN ----------
   Back-fills every cue that has lanes and no output. Called from BOTH ends because the
   order is not guaranteed: a clip can land before the Scene Study has worked out what
   can receive one, and the surfaces can appear after the clip. Returns what it named,
   so the caller can say it out loud once rather than per sequence.

   ONE CUE, ONE SCREEN. It used to name a destination only when there was exactly one wall
   in the room and therefore no decision to make — which meant that the moment a second
   wall went up, every new cue landed with no output at all, and the moment somebody
   filled them in by hand two cues could be stacked on one wall without either of them
   saying so. A room with three walls and three cues means one cue per wall: that is what
   a rig of separate surfaces IS for, and it is the arrangement anybody would then adjust
   away from rather than towards.

   UNLESS THEY ARE LINKED. Linked screens are one canvas and one picture — the canvas is
   the destination, its members are not, and the room reports which screens are inside one
   (see `postRouteTargets`). Without that, a cue would be sent at half of somebody's
   canvas and the room would silently lift it back onto the whole thing, putting two cues
   on one surface by a route nobody chose.

   AND WHEN THE SCREENS RUN OUT, the old rule stands: share, but only where sharing is the
   only possible reading. Four cues in a room with one wall are four cues on that wall —
   they stack, which is what cue priority is for. */
function autoRoute() {
  const named = [];
  const walls = S.targets
    .filter(d => (d.req === 'link' || d.req === 'led') && !d.linked)
    .map(d => d.id);
  /* what is already spoken for, including by a cue somebody routed by hand */
  const taken = new Set(S.seqs.map(q => q.route).filter(Boolean));
  S.seqs.forEach(q => {
    if (q.route || q.routeCleared) return;
    if (!(q.tracks || []).some(x => laneClip(x.trackId))) return;      // no media, no output
    const id = walls.find(w => !taken.has(w)) || obviousRoute();
    if (!id) return;
    q.route = id;
    taken.add(id);
    named.push(routeLabel(id));
  });
  return named;
}

/* ---------- A CUE ASKED FOR FROM THE ROOM ----------
   Somebody dropped a clip from the Content Bin straight onto a wall in the Scene Study.
   The take made the track, wrote the destination and fetched the bytes — but WHICH CUE a
   track belongs to is this panel's decision and nowhere else's, so the room asks and this
   is where the asking is kept until the track it is about actually turns up. Held rather
   than acted on immediately because the bytes, the track and this message arrive in an
   order nobody controls. See `claimCue` in the host. */
const wantCues = new Map();            // trackId -> { route, at }
/* where the first clip on a claimed lane should land, held until its bytes turn up */
const wantStart = new Map();           // trackId -> seconds
/* the cues one pass of `adoptLooseTracks` made, so five clips dropped in a row are one
   sentence in the corner rather than five */
const claimed = [];

/* ---------- THE CUES THE ROOM ASKED FOR ----------
   Run before adoption rather than inside it, and over the CLAIMS rather than over the
   loose tracks — because a claim and the take's track list arrive in an order nobody
   controls. When the list wins the race the track has already been adopted into whatever
   cue was open, and a claim that only looked at loose tracks silently did nothing: the
   clip ended up as another layer on somebody else's cue, on somebody else's wall. So a
   claimed track is taken back out of wherever it landed. */
function applyCueClaims() {
  [...wantCues.entries()].forEach(([trackId, claim]) => {
    if (!S.tracks.some(x => x.id === trackId)) return;      // the take has not got there yet
    wantCues.delete(trackId);
    const from = seqOfTrack(trackId);
    if (from) from.tracks = from.tracks.filter(x => x.trackId !== trackId);
    /* THE EMPTY CUE THAT IS ALREADY THERE GETS FILLED FIRST. A take opens on an empty
       SEQUENCE 1 — it is the show before anybody has put anything in it — so making a
       SEQUENCE 2 for the first clip dropped on a wall left an empty cue sitting above it,
       which reads as a mistake because it is one. Only the SECOND drop is a new cue. */
    const reuse = emptyCue();
    const q = reuse || { id: newSeqId(), name: nextSeqName(), route: null, crop: null, tracks: [] };
    q.route = claim.route || null;
    q.routeCleared = false;
    q.tracks.push({ trackId, kind: 'video' });
    if (!reuse) S.seqs.push(q);
    S.cur = q.id;
    /* UNDER THE PLAYHEAD, so it is on the wall the moment it arrives. The clip may not be
       here yet — the bytes travel separately — so the wish is left for `installClip`; and
       if it HAS arrived it is moved, since nobody has placed it by hand yet. */
    const at = Math.max(0, claim.at || 0);
    const on = clipsOn(trackId);
    if (on.length === 1 && on[0].start < 0.001) { on[0].start = at; reSpan(); }
    else if (!on.length) wantStart.set(trackId, at);
    claimed.push({ q, made: !reuse });
  });
}
function adoptLooseTracks() {
  applyCueClaims();
  const placed = new Set(S.seqs.flatMap(q => q.tracks.map(t => t.trackId)));
  const loose = S.tracks.filter(t => !placed.has(t.id));
  loose.forEach(t => {
    const want = pending.shift();
    const q = (want && S.seqs.find(x => x.id === want.seqId)) || curSeq() || S.seqs[0];
    if (!q) return;                                   // no sequence yet — ensureSequence will take them
    q.tracks.push({ trackId: t.id, kind: want ? want.kind : 'video' });
    if (want && want.then) want.then(t.id);
  });
  /* said once, after the loop, so five clips dropped in a row are one sentence */
  if (claimed.length) {
    const say = (c) => c.q.name + (c.made ? ' made on ' : ' — output ')
                     + (routeLabel(c.q.route) || 'not set');
    toast(claimed.length === 1 ? say(claimed[0])
                               : claimed.length + ' cues from the room — ' + claimed.map(say).join(', '));
    claimed.length = 0;
  }
}
/* ---------- A CUE WITH NOTHING IN IT AND NOTHING SAID ABOUT IT ----------
   Reusable, in other words: no lanes, no output, and nobody having deliberately cleared
   its output — a cleared route is a statement and this would overwrite it. The cue being
   edited is preferred over the first one in the list, because that is the one somebody is
   looking at. */
function emptyCue() {
  const free = (q) => !!q && !q.tracks.length && !q.route && !q.routeCleared;
  const cur = curSeq();
  return free(cur) ? cur : (S.seqs.find(free) || null);
}

function pickSeq(id) {
  if (!S.seqs.some(q => q.id === id)) return;
  S.cur = id; S.sel = null; S.selClip = null;
  build(); publishClips();
  toast('editing ' + (curSeq().name));
}
/* the next cue's name: the lowest number nobody is using, the way cue labels and LED
   names are handed out. Counted over the cues that EXIST rather than over how many there
   are, so deleting SEQUENCE 2 does not make two cues called SEQUENCE 3. */
function nextSeqName() {
  const used = new Set(S.seqs.map(q => q.name));
  let n = 1;
  while (used.has('SEQUENCE ' + n)) n++;
  return 'SEQUENCE ' + n;
}
el('b-seqnew').addEventListener('click', () => {
  const q = { id: newSeqId(), name: nextSeqName(), route: null, crop: null, tracks: [] };
  S.seqs.push(q); S.cur = q.id;
  build(); publishClips();
  /* a sequence with no lanes cannot be worked in, so it opens with one video track
     — the shape every cue has at least once */
  askTrack(q.id, 'video');
  toast(q.name + ' — add clips to it, then give it an output');
});

/* ---------- RENAME ----------
   In place, on the name itself. A cue is referred to by name in a running order,
   so the name is a fact about the show and typing it is the whole gesture. */
function beginRename() {
  const q = curSeq(); if (!q) return;
  const inp = el('seqname');
  el('seqpick').style.display = 'none';
  inp.style.display = ''; inp.value = q.name; inp.focus(); inp.select();
}
function endRename(commit) {
  const q = curSeq(); const inp = el('seqname');
  if (commit && q) {
    const v = inp.value.trim().toUpperCase().slice(0, 40);
    if (v && v !== q.name) { q.name = v; publishClips(); toast('renamed to ' + v); }
  }
  inp.style.display = 'none'; el('seqpick').style.display = '';
  build();
}
el('seqname').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') endRename(true);
  else if (e.key === 'Escape') endRename(false);
});
el('seqname').addEventListener('blur', () => endRename(true));
el('seqpick').addEventListener('dblclick', beginRename);

/* ---------- DUPLICATE ----------
   A real copy: the same lanes, the same clips, the same trims, the same output and
   the same crop. Which means NEW TRACKS, and a track is an object on the take — so
   they are asked for and the copy finishes when they arrive. The bytes are already
   held here, so each new lane is given its file the same way loading one is. */
el('b-seqdup').addEventListener('click', () => {
  const src = curSeq(); if (!src) return;
  const rows = src.tracks.filter(t => S.tracks.some(x => x.id === t.trackId));
  if (!rows.length) return toast('nothing in this sequence to copy');
  const q = { id: newSeqId(), name: nextCopyName(src.name), route: src.route,
              crop: src.crop ? { ...src.crop } : null, tracks: [] };
  S.seqs.push(q); S.cur = q.id;
  rows.forEach(row => {
    /* EVERY CLIP ON THE LANE, in order — a copy of a cue that kept only the first shot
       of each lane would be a copy of something nobody made.

       READ NOW, not in the callback: the take answers asynchronously and the source cue
       can be edited while it does. */
    const cs = clipsOn(row.trackId).map(c => ({
      bytes: c.bytes, name: c.name,
      /* ---------- THE CLIP'S KIND, NOT THE LANE'S ----------
         This used to pass `row.kind` — 'video', because that is what a video LANE is —
         for every clip on it. A still on a video lane therefore came out of DUPLICATE as
         a video: a `<video>` element fed a PNG, which decodes nothing, never measures a
         duration and never draws. The copy had the right lanes with the right filenames
         on them and every one of them was dead, which is what "duplicate does not copy
         the layers" looked like. The clip says what it is; the lane says where it sits. */
      kind: c.kind,
      /* the trim AND the ramps: a crossfade is a property of the clips it is made of, so
         a copy that dropped the fades would cut where the original dissolved */
      over: { start: c.start, in: c.in, out: c.out,
              fadeIn: c.fadeIn || 0, fadeOut: c.fadeOut || 0,
              easeIn: c.easeIn, easeOut: c.easeOut },
    }));
    /* ---------- AND WHAT MAKES THE LANE THAT LAYER ----------
       How it mixes with the one under it, whether it is showing at all, and any frame it
       holds of its own. None of these travelled, so a duplicate of a cue built out of an
       ADD over a background came back as two opaque layers — the same files in the same
       order, composited into something nobody had made. */
    const how = { blend: blendOf(src, row.trackId), hidden: !!row.hidden,
                  crop: row.crop ? { ...row.crop } : null };
    askTrack(q.id, row.kind, (newId) => {
      const lane = q.tracks.find(x => x.trackId === newId);
      if (lane) Object.assign(lane, how);
      cs.forEach(c => {
        if (!c.bytes) return;
        const clipId = newClipId(newId);
        installClip(newId, c.bytes, c.name, { kind: c.kind, clipId, announce: false, publish: false,
                                              over: c.over });
        post('mediaAsset', { trackId: newId, clipId, name: c.name, kind: c.kind, bytes: c.bytes });
      });

        + (rows.length > n ? ' and ' + (rows.length - n) + ' audio' : ''));
});
function nextCopyName(name) {

/* one track, asked of the take, remembered so it can be claimed when it appears */
function askTrack(seqId, kind, then) {

  const n = S.tracks.length + 1;                       // standalone: the take is us
  S.tracks.push({ id: 'mock-t' + n + Math.random().toString(36).slice(2, 5), label: 'TRACK ' + n, name: '' });
  adoptLooseTracks(); build();

/* ---------- DELETE ----------
   The sequence AND its tracks: a lane that belonged to a deleted cue is a lane
   nobody will ever look at again, and leaving it on the take leaves the checklist
   asking for media on it forever. Confirmed once, because it is not undoable here. */
let armedDelete = null;
el('b-seqdel').addEventListener('click', () => {
  const q = curSeq(); if (!q) return;

    armedDelete = q.id;

    el('b-seqdel').classList.add('on');
    toast('press DELETE again to remove ' + q.name + ' and its ' + q.tracks.length + ' track(s)');
    setTimeout(() => { if (armedDelete === q.id) { armedDelete = null; build(); } }, 4000);
    return;

});
/* ---------- REMOVING A CUE ----------
   One writer, two ways in: the DELETE button on the sequence bar, and the DELETE key on a
   cue that has been selected by its header. The key had no branch for a selected CUE at
   all — clips, tracks and cue MARKS each had one — so selecting a sequence and pressing
   DELETE did nothing whatsoever, which is the other half of "sequence 1 cannot be
   deleted": the button worked and the gesture everybody tries first did not. */
function delSeq(q) {
  if (!q) return;

    dropClip(t.trackId);
    if (EMBEDDED) post('remove', { objId: t.trackId });
    else S.tracks = S.tracks.filter(x => x.id !== t.trackId);
  });
  S.seqs = S.seqs.filter(x => x.id !== q.id);

     so the last cue was the one cue you could not delete — see `cuedOnce`. */
  build(); publishClips();

el('b-vtrack').addEventListener('click', () => {
  const q = curSeq(); if (!q) return toast('make a sequence first');
  askTrack(q.id, 'video');
  toast('a video track on top of ' + q.name);
});
el('b-atrack').addEventListener('click', () => {
  const q = curSeq(); if (!q) return toast('make a sequence first');
  askTrack(q.id, 'audio');
  toast('an audio track under ' + q.name);

/* ==========================================================================
   4 · WHAT THIS PANEL SAYS
   `transport` is the CLOCK. `clips` is the SEQUENCE — and it carries the grouping
   itself, so the Video Preview can show the cue you are editing and the host can
   hand it back to a panel that opens later.

   Each clip row also carries the RESOLVED route, crop and priority of its
   sequence. The Scene Study has no idea sequences exist and does not need one:
   the decision is made here, the consequence travels.
   ========================================================================== */
function publishTransport() {
  post('transport', {
    playing: T.playing, t: +T.t.toFixed(3),
    span: T.span, autoSpan: T.autoSpan,
    loop: T.loop, loopIn: T.loopIn, loopOut: T.loopOut,
  });
}
/* a cheap signature of the cue's SHAPE — which sequences exist, what they are
   called, what they are thrown at, and which lanes are in them. Not the clips:
   those have their own reasons to be published and their own moments to do it. */
let groupSig = '';
const groupSigOf = () => S.cur + '|' + S.seqs.map(q =>
  q.id + ':' + q.name + ':' + (q.route || '') + ':' + (Number.isInteger(q.tint) ? q.tint : '')
  + ':' + (q.cue ? q.cue.label + '@' + q.cue.at.toFixed(2) : '')
  + ':' + q.tracks.map(t => t.trackId + t.kind + (t.hidden ? 'H' : '')).join(',')

  groupSig = sig;
  publishClips();
}
function publishClips() {

  /* THE RULE IS ENFORCED HERE rather than at the four places a clip can arrive, because
     this is the single door everything leaves by — so a cue cannot be published with no
     output while the room plainly has one. It only ever fills a blank, so the value it
     sends back arrives identical on the next reconcile and it settles in one pass. */
  autoRoute();
  const rows = [];
  S.seqs.forEach(q => {
    q.tracks.forEach(t => {
      /* ONE ROW PER CLIP. Everything a row carries except the file itself is the LANE'S
         — its route, its blend, its place in the stack, its frame — so the clips of one
         lane publish identical copies of all of it and differ only in what plays and
         when. That is what makes them consecutive rather than layered. */
      clipsOn(t.trackId).forEach(c => {
      rows.push({
        clipId: c.id,
        /* the LANE says video or audio; the CLIP says whether that video lane is
           carrying a moving picture or a still, and the monitor needs to know */
        trackId: t.trackId, seqId: q.id, kind: t.kind, media: c.kind || t.kind, name: c.name,
        dur: +(c.dur || 0).toFixed(3), start: +c.start.toFixed(3),
        in: +(c.in || 0).toFixed(3), out: +(c.out || c.dur || 0).toFixed(3),
        /* the ramps travel: the Video Preview composites them, which is how a
           crossfade between two video layers is a thing you can watch */
        fadeIn: +(c.fadeIn || 0).toFixed(3), fadeOut: +(c.fadeOut || 0).toFixed(3),
        easeIn: c.easeIn === undefined ? 0.5 : +c.easeIn.toFixed(3),
        easeOut: c.easeOut === undefined ? 0.5 : +c.easeOut.toFixed(3),
        /* A HIDDEN LAYER IS OFF THE PICTURE EVERYWHERE. Not a panel preference: if
           the monitor stops showing it, the wall has to stop showing it too, or the
           two disagree about the one thing they are both for. */
        hidden: !!t.hidden,
        /* AUDIO IS NEVER THROWN AT A SURFACE. An LED wall has no speakers and a

        /* v5.9.5 · A SEQUENCE WITHOUT A ROUTE HAS NO OPINION, and saying `null` here
           was the difference between a wall with content on it and a wall gone dark.
           A route is held per TRACK on the take — that is what the Content Bin, the
           room and the AI Content panel all set — and a sequence route is an OVERRIDE
           on top of it. A fresh sequence has `route: null`, so this line was
           broadcasting "throw these clips at NOWHERE" over a perfectly good

        route: t.kind === 'audio' ? null : seqRoute(q),

           second panel needed. A crop this panel publishes has been placed by definition. */
        crop: t.kind === 'audio' ? null : (() => {

      crop: q.crop ? { ...q.crop } : null,
      cue: q.cue ? { at: +q.cue.at.toFixed(3), label: q.cue.label } : null,

/* WHAT THIS PANEL IS ENTITLED TO SAY ABOUT A DESTINATION.
     the sequence has one          → that surface, and it overrides the track's
     somebody chose "nowhere"      → null, which really does mean nowhere
     neither                       → undefined: no opinion, leave the track's alone

const seqRoute = (q) => (q && q.route) ? q.route : ((q && q.routeCleared) ? null : undefined);

/* the checklist's own vocabulary — ASSIGN MEDIA and SET IN / OUT are steps on the
   take, and this is the panel that closes them */
function reportMedia(trackId) {
  const on = clipsOn(trackId);
  const c = on[0]; if (!c) return;
  const track = S.tracks.find(t => t.id === trackId);
  const q = seqOfTrack(trackId);
  /* THE LANE, NOT ONE CLIP ON IT. The checklist step is "this track has media", and a
     lane carrying three shots has answered that three times over — so the name says how
     many and the length is what the lane occupies from its first head to its last tail,
     which is the number somebody reading a rundown is after. */
  post('media', {
    trackId, name: on.length > 1 ? c.name + ' +' + (on.length - 1) : c.name,
    durationMs: Math.round((laneEnd(trackId) - c.start) * 1000),
    startMs: Math.round(c.start * 1000),
    /* the same distinction, and it matters more here: this one is written straight
       onto the take (`t.mediaRoute`), so a null asserted in ignorance does not just
       darken a wall, it forgets where the content was going. */
    route: (q && c.kind !== 'audio') ? seqRoute(q) : null,
    label: track ? track.label : trackId,
  });
