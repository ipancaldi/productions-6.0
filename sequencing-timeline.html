/* ==========================================================================
   5 · LOADING A FILE
   The bytes travel, not a URL: an object URL is private to the document that made
   it, and the Scene Study and every Camera POV need the same file.
   ========================================================================== */
const isAudioFile = (f) => /^audio\//.test(f.type) || /\.(mp3|wav|aac|m4a|flac|ogg)$/i.test(f.name);
const isImageFile = (f) => /^image\//.test(f.type || '') || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name || '');
/* A STILL HAS NO LENGTH OF ITS OWN. Five seconds is the length of a holding slate
   in every rundown anybody has written, and it is trimmable like anything else —
   what matters is that it HAS one, because a clip with no length cannot be cut. */
const STILL_SECS = 5;

function loadFile(trackId, file) {
  if (!trackId) return toast('select a track first');
  const row = (seqOfTrack(trackId) || { tracks: [] }).tracks.find(t => t.trackId === trackId);
  const lane = row ? row.kind : 'video';
  if (lane === 'audio' && !isAudioFile(file)) return toast(file.name + ' is not audio — drop it on a video track');
  if (lane === 'video' && isAudioFile(file)) return toast(file.name + ' is audio — drop it on an audio track');
  /* a STILL goes on a video lane and is a clip like any other, with a length that
     was decided rather than measured */
  const kind = lane === 'audio' ? 'audio' : (isImageFile(file) ? 'image' : 'video');
  file.arrayBuffer().then(buf => {
    /* minted here rather than inside `installClip` so the same id goes out with the
       bytes: the take stores the file under it, and every other panel keys on it */
    const clipId = newClipId(trackId);
    installClip(trackId, buf, file.name, { kind, clipId, announce: true, publish: true });
    post('mediaAsset', { trackId, clipId, name: file.name, kind, bytes: buf });
  });
}

function dropClip(clipId) {
  const c = S.clips.get(clipId);
  if (!c) return;
  /* A STILL'S ELEMENT IS AN <img>, AND AN IMG CANNOT PAUSE.
     `c.video` holds whatever element the clip is made of — a <video>, an <audio> or an
     <img> — and that field name is a fossil from when it could only be the first.
     Calling `.pause()` on it unconditionally threw a TypeError for every still, and
     because `dropClip` runs FIRST in `delTrack`, the throw took the whole deletion with
     it: `post('remove')` never fired, the take kept the object, the lane stayed, and
     nothing anywhere said why. That is the "I can't delete video tracks any more" bug,
     and it only started biting when stills began arriving on tracks in numbers.
     `installClip` guards the identical call on its replace path — this one was missed,
     which is what a duplicated teardown gets you. */
  const el = c.video;
  if (el) {
    if (typeof el.pause === 'function') el.pause();
    if (el.src) URL.revokeObjectURL(el.src);
    el.remove();
  }
  S.clips.delete(clipId);
  if (S.selClip === clipId) S.selClip = null;
}

function installClip(trackId, bytes, name, opt) {
  opt = opt || {};
  const kind = opt.kind === 'audio' ? 'audio' : (opt.kind === 'image' ? 'image' : 'video');
  /* WHICH CLIP THIS IS. An id given explicitly wins — a replay of something already on
     the lane must land back on ITSELF rather than beside itself, and a drop that reserved
     an id before asking for the bytes has already decided. Otherwise this is the lane's
     first clip and its id IS the lane's: see `newClipId`. */
  const clipId = opt.clipId || newClipId(trackId);
  const prev = S.clips.get(clipId);
  /* THIS CLIP WAS ASKED FOR FROM THE ROOM, and it is being placed somewhere nobody else
     knows about yet — see `applyCueClaims`. Bytes arriving from the take are normally a
     REPLAY of something already published, so they publish nothing; this one is not, and
     without a publish the room is never told where the clip went. That is the whole of
     "the clip I dropped on the wall does not appear until I touch something": it was on
     the lane, at the right time, and the wall had been told 00:00. */
  const fromRoom = wantStart.has(trackId) && !clipsOn(trackId).length;
  const media = document.createElement(kind === 'audio' ? 'audio' : kind === 'image' ? 'img' : 'video');
  media.src = URL.createObjectURL(new Blob([bytes]));
  if (kind !== 'image') { media.muted = true; media.playsInline = true; media.preload = 'auto'; }
  el('videos').appendChild(media);
  if (prev) { if (prev.video.pause) prev.video.pause(); URL.revokeObjectURL(prev.video.src); prev.video.remove(); }

  const clip = Object.assign({
    id: clipId, trackId,
    name: name || 'clip', kind, dur: 0, in: 0, out: 0,
    /* AFTER WHAT IS ALREADY THERE. A second file dropped on a lane is the next shot,
       so it starts where the last one ends — butted up, no black between them. Its own
       length is not known yet, which does not matter: the head is what is being placed.
       On an empty lane that end is zero, so this is also the old rule.

       UNLESS THE ROOM ASKED FOR IT SOMEWHERE, which is a clip dropped onto a wall while
       the show was parked partway through — see `applyCueClaims`. */
    start: prev ? prev.start : startWanted(trackId),
    video: media, strip: null, bytes,
  }, opt.over || {});
  S.clips.set(clipId, clip);

  /* ---------- HOW LONG IS IT, ACTUALLY ----------
     `loadedmetadata` is NOT a promise that the duration is known. A file written by
     a recorder — anything streamed, anything fragmented — arrives with
     `duration === Infinity` and only settles on `durationchange`, and a WebM from
     MediaRecorder never settles at all until something SEEKS PAST THE END, which is
     what makes the browser resolve where the end is. Both are handled: the length is
     taken whenever it becomes finite, and the seek is done once if it has to be.
     Getting this wrong put Infinity on the clip, which made the show's length
     infinite and collapsed every block on every lane to nothing. */
  /* a still is READY the moment it has decoded: its length was decided, not
     measured, so there is nothing to wait for beyond the pixels */
  if (kind === 'image') {
    const ready = () => {
      clip.dur = STILL_SECS;
      /* only if nobody has said otherwise: a still that was stretched to forty
         seconds and then reloaded must not snap back to five, because forty was a
         decision and five is only a default */
      if (!clip.out) clip.out = STILL_SECS;
      /* ---------- AND NOW IT HAS A LENGTH, SO IT CAN BE PLACED ----------
         `start` was set to the end of the lane when this clip was made — but a clip
         whose length is not known yet has NO end, so two files dropped on one lane in
         quick succession both measured the lane at zero and landed on top of each other.
         Resolved the moment the length is real, by the same rule a drag uses. */
      deOverlap(clip);
      reSpan(); build(); stillThumb(clip);
      if (opt.announce) {
        S.selClip = clipId; S.sel = trackId;
        S.focus = { kind: 'clip', id: clipId };
        reportMedia(trackId);
        toast(clip.name + ' — a ' + STILL_SECS + 's still, trim it like anything else');
      }
      if (opt.publish !== false || fromRoom) publishClips();
    };
    media.addEventListener('load', ready);
    media.addEventListener('error', () => toast('could not decode ' + clip.name));
    if (media.complete && media.naturalWidth) ready();
    build();
    return;
  }
  let settled = false;
  const settle = () => {
    const d = media.duration;
    if (!isFinite(d) || d <= 0) return;
    if (settled && Math.abs(d - clip.dur) < 0.01) return;
    settled = true;
    clip.dur = d;
    if (!clip.out || clip.out > clip.dur) clip.out = clip.dur;
    if (clip.in >= clip.out) clip.in = 0;
    /* the length is only real now, and where this clip sits depended on it — see the
       same call on the still path above */
    deOverlap(clip);
    reSpan(); build();
    if (kind === 'audio') waveform(clip); else filmstrip(clip);
    if (opt.announce) {
      S.selClip = clipId; S.sel = trackId;
      S.focus = { kind: 'clip', id: clipId };
      reportMedia(trackId);
      const track = S.tracks.find(t => t.id === trackId);
      const n = clipsOn(trackId).length;
      toast(clip.name + ' on ' + (track ? track.label : trackId)
        + (n > 1 ? ' — clip ' + n + ' on that lane, after ' + mmss(clip.start) : ' — drag it to move it in time'));
    }
    if (opt.publish !== false || fromRoom) publishClips();
  };
  let probed = false;
  const probe = () => {
    if (probed || isFinite(media.duration)) return;
    probed = true;
    try { media.currentTime = 1e101; } catch (e) { /* nothing else to try */ }
  };
  const onKnown = () => {
    const was = settled;
    settle();
    if (settled && !was && probed) { try { media.currentTime = 0; } catch (e) {} }
  };
  media.addEventListener('loadedmetadata', () => { onKnown(); probe(); });
  media.addEventListener('durationchange', onKnown);
  media.addEventListener('error', () => toast('could not decode ' + clip.name));
  build();
}

/* ---------- the filmstrip ----------
   Up to eight frames across the clip, drawn once and kept as a data URL. Seeking is
   asynchronous and serialised, so this runs as a queue: one clip at a time. */
let stripBusy = false;
const stripQ = [];
function filmstrip(clip) { stripQ.push(clip); if (!stripBusy) nextStrip(); }
function nextStrip() {
  const clip = stripQ.shift();
  if (!clip) { stripBusy = false; return; }
  stripBusy = true;
  const v = clip.video;
  if (!v || !clip.dur || v.readyState < 1) return nextStrip();
  const H = 40, N = Math.max(2, Math.min(8, Math.round(clip.dur / 4)));
  const ar = (v.videoWidth || 16) / (v.videoHeight || 9);
  const W = Math.max(12, Math.round(H * ar));
  const cv = document.createElement('canvas');
  cv.width = W * N; cv.height = H;
  const cx = cv.getContext('2d');
  let i = 0;
  const shoot = () => {
    if (S.clips.get(clip.id) !== clip) return nextStrip();
    if (i >= N) { clip.strip = cv.toDataURL('image/jpeg', 0.6); build(); return nextStrip(); }
    const at = clip.dur * ((i + 0.5) / N);
    const onSeek = () => {
      v.removeEventListener('seeked', onSeek);
      try { cx.drawImage(v, i * W, 0, W, H); } catch (e) { /* a frame that will not paint is not fatal */ }
      i++; shoot();
    };
    v.addEventListener('seeked', onSeek);
    try { v.currentTime = at; } catch (e) { v.removeEventListener('seeked', onSeek); i = N; shoot(); }
  };
  shoot();
}

/* a still's "filmstrip" is the still itself — which is what it looks like on a
   wall for however long it is held */
function stillThumb(clip) {
  const img = clip.video;
  const H = 40, W = Math.max(12, Math.round(H * (img.naturalWidth || 16) / (img.naturalHeight || 9)));
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  try { cv.getContext('2d').drawImage(img, 0, 0, W, H); clip.strip = cv.toDataURL('image/jpeg', 0.7); build(); }
  catch (e) { /* a still that will not paint is not fatal */ }
}

/* ---------- the waveform ----------
   The audio equivalent of the filmstrip, and the same argument: a lane you cannot
   read is a lane you cannot line a hit up on. Peaks only — min and max per column,
   which is what a waveform IS — drawn once into a data URL and stretched to the
   block, so trimming re-uses it rather than re-decoding a 40 MB stem. */
function waveform(clip) {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !clip.bytes) return;
  const ac = new AC();
  /* decodeAudioData DETACHES the buffer it is given, and this one is the copy the
     panel keeps for DUPLICATE — so it is handed a slice, never the original */
  ac.decodeAudioData(clip.bytes.slice(0)).then(buf => {
    const W = 600, H = 40;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const cx = cv.getContext('2d');
    const data = buf.getChannelData(0);
    const per = Math.max(1, Math.floor(data.length / W));
    /* the cue's own colour, so a waveform says which sequence it belongs to at the
       same glance as everything else in that group. Fixed teal made every audio
       lane in the show look like it belonged to the same cue. */
    const q = seqOfTrack(clip.trackId);
    cx.strokeStyle = (q ? accentOf(q.id) : '#6BFFDC') + 'C0';
    cx.lineWidth = 1;
    cx.beginPath();
    for (let x = 0; x < W; x++) {
      let lo = 1, hi = -1;
      for (let i = x * per, n = Math.min(data.length, i + per); i < n; i++) {
        const s = data[i];
        if (s < lo) lo = s;
        if (s > hi) hi = s;
      }
      if (lo > hi) { lo = hi = 0; }

}

/* ==========================================================================
   6 · HOW LONG THE SHOW IS
   ========================================================================== */
/* THE SHOW IS AS LONG AS THE WORK IN IT — every clip on every track of every
   sequence, plus any cue called after the last of them. Rounded up to something a
   ruler can label. Setting a length by hand still wins, but it can no longer be
   SHORTER than the content: a timeline that ends before its last cue does is a
   timeline lying about the show. */

  const ends = [...S.clips.values()].map(clipEnd).filter(v => isFinite(v));
  S.seqs.forEach(q => { if (q.cue) ends.push(q.cue.at); });
  const need = Math.max(30, ...ends);
  const span = T.autoSpan ? Math.ceil(need / 10) * 10 : Math.max(T.span, Math.ceil(need / 10) * 10);

  T.loopIn = Math.min(T.loopIn, T.span - 1);

/* ==========================================================================
   7 · THE TRANSPORT
   ⚠ NOT requestAnimationFrame. This clock is the TAKE'S — the Scene Study, every
   Camera POV and the Video Preview all follow it — and rAF only fires while the
   document is being PAINTED. A panel behind a window or in a background tab would
   stop the show for everybody while looking, in here, exactly like a clock somebody
   paused. Measured: zero rAF callbacks with `playing` true and the playhead pinned
   at 00:00.0 on every panel.

   An interval keeps running when frames do not, and the time comes from the WALL
   CLOCK rather than from counting ticks — so a throttled panel updates less often
   and still knows exactly what time it is.
   ========================================================================== */

function step() {

  const now = performance.now();
  /* past a couple of seconds this stops being a slow tick and starts being a STALL —
     the document was suspended — and inventing that time would jump the show past
     cues nobody saw. So a long gap resumes rather than accumulates. */
  const gap = (now - lastTick) / 1000;
  if (gap <= 2) T.t += gap;
  lastTick = now;
  if (T.loop) {
    if (T.t >= loopOut() || T.t < T.loopIn) T.t = T.loopIn;
  } else if (T.t >= T.span) { T.t = T.span; setPlaying(false); }

/* ==========================================================================
   8 · ZOOM
   The lanes were laid out as a PERCENTAGE of the show's length, which is the same
   as saying the show always exactly fits the panel. That is fine until a cue is
   four seconds long inside a twenty-minute running order, at which point it is
   nine pixels wide and cannot be trimmed by hand at all.

   So the unit is PIXELS PER SECOND. Zoom changes it, the content gets wider than
   the panel, and one native scroller handles the panning — with the ruler pinned
   to the top and the name gutter pinned to the left, so the two things you need in
   order to read a lane never scroll away from it.

const secAt = (px) => px / Z.pps;

/* ZOOM ABOUT A POINT, not about zero. Zooming towards the left edge throws away

   you press a button and around the pointer when you use the wheel. */
function setZoom(pps, anchorSec, anchorPx) {
  const sc = el('hscroll');
  const want = Math.max(Z.min, Math.min(Z.max, pps));
  if (Math.abs(want - Z.pps) < 1e-6) return;
  const at = anchorSec === undefined ? secAt(sc.scrollLeft + sc.clientWidth / 2) : anchorSec;
  const keep = anchorPx === undefined ? sc.clientWidth / 2 : anchorPx;

}

   is answerable by eye across six stacked cues */
function sizeGuides() {
  const g = el('guides');
  if (g) g.style.height = el('hinner').scrollHeight + 'px';
}

/* ==========================================================================
   9 · DRAWING IT
   EVERY SEQUENCE, STACKED. They are all on screen because a running order is a
   sequence of cues and you cannot see one by looking at a cue on its own — the
   question "does ACT TWO start before ACT ONE has finished" is unanswerable in a
   panel that shows one at a time. What keeps them apart is the grouping: a
   coloured spine down each one, a header that carries the cue's own controls, and
   everything except the one being edited dimmed rather than hidden.
   ========================================================================== */

const ICON_WAVE = '<svg viewBox="0 0 12 12"><path d="M1 6h1.4l1-3.4L5 9.6l1.6-6L8.2 8l.9-2H11" fill="none" '
  + 'stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/></svg>';

   hidden state reads as struck out rather than merely faint. */

  + '<circle cx="6" cy="6" r="1.55" fill="currentColor"/></svg>';

  + '<circle cx="6" cy="6" r="1.55" fill="currentColor"/></g>'

   draggable: reordering two of them SWAPPED their colours, so the one thing the
   accent exists to say — "this spine, this lane and this clip are the same cue" —
   changed the moment you moved anything, and the eye had to relearn the stack after
   every drag. It is claimed once and kept ON the sequence instead, so it survives a
   reorder, a rename, a reopen and the other panel. A new cue takes the lowest accent
   nobody is wearing, so they stay as distinct as cycling made them. */
const freeTint = () => {
  const worn = new Set(S.seqs.map(q => q.tint).filter(Number.isInteger));
  for (let i = 0; i < SEQ_ACCENTS.length; i++) if (!worn.has(i)) return i;

const accentOf = (qid) => {

const folded = new Set();          // sequence ids drawn as a bar only
let dragging = false;              // something is under the hand: do not scroll under it

/* ---------- HOW LONG A SEQUENCE IS ----------
   From its first frame to its last, over every track in it — which is what the bar
   spans and what "drag the cue in time" moves. A sequence with nothing in it still
   gets a grabbable length, because an empty cue you cannot pick up is an empty cue
   you cannot place. */
const MIN_SEQ = 6;
function seqExtent(q) {
  const cs = q.tracks.flatMap(t => clipsOn(t.trackId)).filter(c => clipLen(c) > 0);
  if (!cs.length) {

/* ---------- SNAPPING ----------
   Everything worth landing on: the ends of every clip, the head and tail of every
   sequence, every cue, the playhead, and zero. Within a few pixels the thing in

    if (q.cue) out.push(q.cue.at);
    q.tracks.forEach(t => {

         up against the one before it a single gesture. `exclude` is the clip in hand:
         its own ends are not something to land on. */
      clipsOn(t.trackId).forEach(c => {

function build() {
  const rows = el('rows');

    paintSeqBar(); paintRuler(); paintChrome(); paintFoot();

  }

    const list = rowsOf(q);
    const cur = q.id === S.cur;
    const fold = folded.has(q.id);
    const v = list.filter(r => r.kind === 'video').length, a2 = list.length - v;
    const seqSel = S.focus && S.focus.kind === 'seq' && S.focus.id === q.id;

                  + ' data-blend="' + row.trackId + '"'

  }));

      try { e.dataTransfer.setData('text/plain', 'cue:' + liftSeq); } catch (err) {}
      e.stopPropagation();
      const grp = n.closest('.grp'); if (grp) grp.classList.add('dragging');
    });
    n.addEventListener('dragend', () => { liftSeq = null; clearMarks(); });
  });
  rows.querySelectorAll('.grp[data-grp]').forEach(g => {
    g.addEventListener('dragover', (e) => {
      if (!liftSeq || g.dataset.grp === liftSeq) return;    // a layer or a file drag
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      const b = g.getBoundingClientRect();
      markDrop(g, (e.clientY - b.top) < b.height / 2 ? 'dropabove' : 'dropbelow',
               '.grp[data-grp="' + liftSeq + '"]');
    });
    g.addEventListener('drop', (e) => {
      if (!liftSeq) return;
      e.preventDefault(); e.stopPropagation();
      const b = g.getBoundingClientRect();
      restackSeq(liftSeq, g.dataset.grp, (e.clientY - b.top) < b.height / 2);
      liftSeq = null; clearMarks();
    });
  });
  rows.querySelectorAll('[data-lift]').forEach(n => {
    n.addEventListener('dragstart', (e) => {
      /* the buttons are `draggable="false"`, but a drag begun ON one still bubbles
         to here in some builds — so it is checked rather than assumed */
      if (e.target.closest('[data-hide],[data-del]')) { e.preventDefault(); return; }
      lift = n.dataset.lift;
      e.dataTransfer.effectAllowed = 'move';
      /* something has to be set or Safari abandons the drag; the payload is not used
         because the reorder is entirely inside this panel */
      try { e.dataTransfer.setData('text/plain', 'layer:' + lift); } catch (err) {}
      const row = n.closest('.row'); if (row) row.classList.add('dragging');
    });
    n.addEventListener('dragend', () => { lift = null; clearMarks(); });
  });
  rows.querySelectorAll('.row[data-track]').forEach(r => {
    r.addEventListener('dragover', (e) => {
      if (!lift) return;                                  // a file drag: leave it to the lane
      const target = r.dataset.track;
      const q = seqOfTrack(target);
      const row = q && q.tracks.find(t => t.trackId === target);
      if (!row || row.kind !== 'video' || target === lift) return;
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      const b = r.getBoundingClientRect();
      const above = (e.clientY - b.top) < b.height / 2;
      markDrop(r, above ? 'dropabove' : 'dropbelow', '.row[data-track="' + lift + '"]');
    });
    r.addEventListener('drop', (e) => {
      if (!lift) return;
      e.preventDefault(); e.stopPropagation();
      const b = r.getBoundingClientRect();
      restack(lift, r.dataset.track, (e.clientY - b.top) < b.height / 2);
      lift = null; clearMarks();
    });
  });
  rows.querySelectorAll('[data-lane]').forEach(l => {
    l.addEventListener('pointerdown', (e) => {
      if (e.target.closest('[data-clip]')) return;
      /* clicking empty lane is about the LANE, not about deleting it — the focus
         goes to the track but DELETE on a bare lane click would be a trap, so an
         empty-lane click leaves the focus where it was unless there was none */
      selectTrack(l.dataset.lane, S.focus ? S.focus.kind : 'track');
      const r = l.getBoundingClientRect();
      scrubTo(secAt(e.clientX - r.left));
    });
    l.addEventListener('dragover', (e) => {
      e.preventDefault();
      /* saying COPY is what makes the cursor promise the drop will work — without
         it the pointer shows the "no" ring over a lane that will accept the file */
      try { e.dataTransfer.dropEffect = 'copy'; } catch (err) {}
      /* only when it changes: `dragover` fires continuously, and re-adding a class the
         element already has is a style recalculation per pointer sample */
      if (!l.classList.contains('over')) l.classList.add('over');
    });
    /* LEAVING A CHILD IS NOT LEAVING THE LANE. `dragleave` bubbles, so crossing onto a
       clip block inside the lane fired it and the highlight blinked off and back on for
       the whole drag. */
    l.addEventListener('dragleave', (e) => {
      if (e.relatedTarget && l.contains(e.relatedTarget)) return;
      l.classList.remove('over');
    });
    l.addEventListener('drop', (e) => {
      e.preventDefault(); e.stopPropagation(); l.classList.remove('over');
      /* FROM THE CONTENT BIN. A drag between two panels moves strings, not
         megabytes, so what lands here is an id — the bin is asked for the file and
         answers with an ordinary `mediaAsset`, which reaches this track by the same
         door a file opened from a lane comes through. */
      const raw = binPayload(e.dataTransfer);
      if (raw) {
        try { landAsset(JSON.parse(raw), l.dataset.lane); }
        catch (err) { toast('could not read that drop'); }
        return;
      }
      const f = e.dataTransfer.files[0];
      if (f) loadFile(l.dataset.lane, f);
    });
  });

  paintSeqBar(); layout(); sizeGuides(); paintChrome(); paintFoot();
}

/* the next free cue number, counted over the cues that exist rather than over the
   sequences — deleting SEQUENCE 2 must not make two cues called CUE 3 */
function nextCueLabel() {
  const used = new Set(S.seqs.map(q => q.cue && q.cue.label).filter(Boolean));
  let n = 1;
  while (used.has('CUE ' + n)) n++;
  return 'CUE ' + n;
}

/* MOVING A LAYER, in display order. `before` means "land above the target", which is
   what the insertion line was drawn at.

   The write-back is the only place that knows about storage order, which is the point:
   one reversal, in one function, instead of every caller reasoning about it. Audio
   keeps its own order and is never touched — an audio track has no layer above it. */
function restack(moved, target, before) {
  const q = seqOfTrack(moved);
  if (!q || moved === target || !seqOfTrack(target)) return;
  const vid = rowsOf(q).filter(r => r.kind === 'video').map(r => r.trackId);   // top → bottom
  const from = vid.indexOf(moved), to = vid.indexOf(target);
  if (from < 0 || to < 0) return;
  vid.splice(from, 1);
  const at = vid.indexOf(target) + (before ? 0 : 1);
  vid.splice(at, 0, moved);
  const byId = new Map(q.tracks.map(t => [t.trackId, t]));
  const aud = q.tracks.filter(t => t.kind !== 'video');
  /* display is top-first, storage is bottom-first */
  q.tracks = vid.slice().reverse().map(id => byId.get(id)).filter(Boolean).concat(aud);
  build(); publishClips();
  const now = rowsOf(q).filter(r => r.kind === 'video');
  const me = now.find(r => r.trackId === moved);
  toast(me ? me.label + ' is now ' + (me.top ? 'the top layer — this is the picture'
                                             : 'layer ' + me.label + ', under ' + now[now.indexOf(me) - 1].label)
           : 'layers restacked');
}

/* DELETING A TRACK. The lane, its clip and the take's object — a track that only
   exists on the take is a row the checklist goes on asking for media on. */
function delTrack(trackId) {
  const q = seqOfTrack(trackId); if (!q) return;
  const row = q.tracks.find(t => t.trackId === trackId);
  const label = (rowsOf(q).find(r => r.trackId === trackId) || {}).label || 'that track';
  dropClip(trackId);
  q.tracks = q.tracks.filter(t => t.trackId !== trackId);
  if (EMBEDDED) post('remove', { objId: trackId });
  else S.tracks = S.tracks.filter(t => t.id !== trackId);
  if (S.sel === trackId) S.sel = null;
  if (S.focus && S.focus.id === trackId) S.focus = null;
  build(); publishClips();
  toast(label + ' deleted' + (row && row.kind === 'audio' ? '' : ' — the layers under it move up'));
}

/* ---------- the sequence bars, the cues and the guides ----------
   Painted with the clips rather than with the rows, because all three move when
   the ZOOM changes and none of them changes when a lane does. */
function paintBars() {
  const guides = el('guides');
  let g = '';
  S.seqs.forEach(q => {
    const e = seqExtent(q);
    const lane = document.querySelector('[data-glane="' + q.id + '"]');
    if (lane) {
      const route = routeLabel(q.route);
      const len = Math.max(0, e.to - e.from);
      const w = Math.max(26, xOf(len));
      /* A CUE AT THE HEAD OF ITS OWN BAR — which is the normal case, because a cue
         is usually called where the cue starts — sat on top of the name and ate it.
         The bar makes room for the chip instead of fighting it. */
      const cueAtHead = q.cue && (xOf(q.cue.at) - xOf(e.from)) < 54 && q.cue.at >= e.from - 0.001;
      const cueW = cueAtHead ? Math.max(0, xOf(q.cue.at) - xOf(e.from)) + 52 : 0;
      /* WHAT FITS, IN ORDER OF WHAT MATTERS. The name is what a cue IS called and
         the last thing to give up room; the length is the first. A short sting's
         bar is 40px wide and it still has to say which sting it is — the earlier
         version let the name collapse to nothing and left two chips behind it,
         which is exactly backwards. */
      const cueSel = S.focus && S.focus.kind === 'cue' && S.focus.id === q.id;
      lane.innerHTML = '<div class="gbar" data-gbar="' + q.id + '" style="left:' + xOf(e.from)
        + 'px;width:' + w + 'px;padding-left:' + (cueW || 6) + 'px"'
        + ' title="' + esc(q.name) + ' · ' + mmss(e.from) + ' → ' + mmss(e.to)
        + (route ? ' · ' + esc(route) : ' · no output')
        + ' — drag to move the whole sequence in time, double-click the name to rename it">'
        + '<b data-rename="' + q.id + '">' + esc(q.name) + '</b>'
        + (w > 180 + cueW ? '<span class="out' + (route ? ' on' : '') + '">' + esc(route || 'NO OUT') + '</span>' : '')
        + (w > 250 + cueW ? '<span class="len">' + (e.empty ? 'empty' : len.toFixed(1) + 's') + '</span>' : '')
        + '</div>'
        + (q.cue ? '<div class="cue' + (cueSel ? ' sel' : '') + '" style="left:' + xOf(q.cue.at) + 'px"><i></i>'
                 + '<b data-cuedrag="' + q.id + '" title="' + esc(q.cue.label) + ' — drag to move the cue and its sequence · DELETE removes it">'
                 + esc(q.cue.label) + '</b></div>' : '');
      const bar = lane.querySelector('[data-gbar]');
      bar.addEventListener('pointerdown', (ev) => barDown(ev, q));
      const nm = lane.querySelector('[data-rename]');
      nm.addEventListener('dblclick', (ev) => { ev.stopPropagation(); renameOnBar(q, nm); });
      const cd = lane.querySelector('[data-cuedrag]');
      if (cd) cd.addEventListener('pointerdown', (ev) => {
        S.focus = { kind: 'cue', id: q.id };
        S.cur = q.id;
        cueDown(ev, q);
      });
    }
    /* the guides: head and tail of every cue, full height, faint */
    if (!e.empty) {
      g += '<div class="g" style="left:' + xOf(e.from) + 'px"></div>'
         + '<div class="g tail" style="left:' + xOf(e.to) + 'px"></div>';
    }
    if (q.cue) g += '<div class="g" style="left:' + xOf(q.cue.at) + 'px"></div>';
  });
  guides.innerHTML = g;
}

/* renaming, in place, on the bar — the name is a fact about the show and typing it
   is the whole gesture */
function renameOnBar(q, node) {
  const inp = document.createElement('input');
  inp.value = q.name; inp.spellcheck = false; inp.maxLength = 40;
  node.replaceWith(inp);
  inp.focus(); inp.select();
  const done = (commit) => {
    if (commit) {
      const v = inp.value.trim().toUpperCase().slice(0, 40);
      if (v && v !== q.name) { q.name = v; publishGrouping(); toast('renamed to ' + v); }
    }
    build();
  };
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') done(true);
    else if (e.key === 'Escape') done(false);
  });
  inp.addEventListener('blur', () => done(true));
  inp.addEventListener('pointerdown', (e) => e.stopPropagation());
}

/* DRAGGING A SEQUENCE. Folded or open — the bar is the cue, and picking it up
   picks up everything in it. Snaps to the other cues' ends, which is how you lay a
   running order out back to back without arithmetic. */
function barDown(e, q) {
  if (e.target.closest('input')) return;
  e.preventDefault(); e.stopPropagation();
  if (q.id !== S.cur) { S.cur = q.id; build(); publishGrouping(); }
  dragging = true;
  const e0 = seqExtent(q);
  const x0 = e.clientX, from0 = e0.from;
  const mine = new Set(q.tracks.map(t => t.trackId));
  let moved = 0;
  const onMove = (ev) => {
    const raw = Math.max(0, from0 + (ev.clientX - x0) / Z.pps);
    /* the HEAD is what snaps — a cue lands where the one before it ended */
    const want = snap(raw, mine, ev.altKey);
    const cur = seqExtent(q).from;
    moved = want - cur;
    if (moved) { moveSeq(q, moved); reSpan(); paintBars(); paintClips(); }
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    dragging = false; showSnap(null);
    reSpan(); build(); publishClips();
    q.tracks.forEach(t => reportMedia(t.trackId));
    const e2 = seqExtent(q);
    toast(q.name + ' · ' + mmss(e2.from) + ' → ' + mmss(e2.to));
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* dragging the CUE moves the sequence with it: the cue is where the thing is
   called, so moving the call moves what it calls */
function cueDown(e, q) {
  e.preventDefault(); e.stopPropagation();
  dragging = true;
  const x0 = e.clientX, at0 = q.cue.at;
  const mine = new Set(q.tracks.map(t => t.trackId));
  const onMove = (ev) => {
    const want = snap(Math.max(0, at0 + (ev.clientX - x0) / Z.pps), mine, ev.altKey);
    const d = want - q.cue.at;
    if (d) { moveSeq(q, d); reSpan(); paintBars(); paintClips(); }
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    dragging = false; showSnap(null);
    reSpan(); build(); publishClips();
    toast(q.cue.label + ' at ' + mmss(q.cue.at).slice(0, 5));
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* selecting a lane selects its CUE as well — the two cannot disagree, because
   LOAD, + VIDEO and the sequence bar all act on whichever cue is current */
/* SELECTING THE CUE, not a lane in it. There was no gesture for this at all — the
   sequence header was the only row in the panel you could not click — and without one
   "crop the whole cue" was only reachable by having nothing selected, which is a state
   you fall into rather than choose. Clicking the header now says it out loud, and the
   crop button changes its name to match. */
function selectSeq(seqId) {
  const q = S.seqs.find(x => x.id === seqId); if (!q) return;
  const changed = q.id !== S.cur;
  S.sel = null; S.selClip = null;
  S.focus = { kind: 'seq', id: q.id };
  S.cur = q.id;
  build();
  if (changed) { publishGrouping(); toast('editing ' + q.name); }
}
function selectTrack(trackId, kind) {
  const q = seqOfTrack(trackId);
  const changed = q && q.id !== S.cur;
  S.sel = trackId;
  S.focus = { kind: kind || 'track', id: trackId };
  if (q) S.cur = q.id;
  build();
  if (changed) { publishGrouping(); toast('editing ' + q.name); }
}

/* ---------- the clips, and the loop band ----------
   Painted separately from the rows because ZOOM moves them and nothing else, and
   rebuilding every lane's markup on a wheel gesture is how a timeline becomes
   sluggish. `build` lays out the lanes; this puts the blocks in them. */
function paintClips() {
  document.querySelectorAll('[data-lane]').forEach(lane => {
    const trackId = lane.dataset.lane;
    const on = clipsOn(trackId);
    [...lane.querySelectorAll('[data-clip], .band, .xf')].forEach(n => n.remove());
    const emptyEl = lane.querySelector('[data-empty]');

    if (T.loop) {
      const band = document.createElement('div');
      band.className = 'band';
      band.style.left = xOf(T.loopIn) + 'px';
      band.style.width = Math.max(1, xOf(loopOut()) - xOf(T.loopIn)) + 'px';
      lane.appendChild(band);
    }
    if (!on.length) return;
    /* the lane's placeholder says what it is still waiting for, whichever clip that is —
       a lane with two shots on it and a third being measured is not an empty lane */
    if (emptyEl) {
      const waiting = on.find(x => !x.dur || clipLen(x) <= 0);
      emptyEl.textContent = waiting ? 'measuring ' + waiting.name + '…' : '';
    }
    on.forEach(c => paintOneClip(lane, trackId, c));
  });
  paintBars();
}
function paintOneClip(lane, trackId, c) {
    if (!c.dur || clipLen(c) <= 0) return;

    const live = T.t >= c.start && T.t < clipEnd(c);
    /* A HELD STILL IS NOT A TRIMMED CLIP. `out < dur` means "frames were cut off
       the end" for a movie, and means nothing at all for a still whose length was
       chosen — marking it orange would say something was lost when nothing was. */
    const trimmed = c.kind !== 'image' && (c.in > 0.01 || c.out < c.dur - 0.01);
    const hasFade = (c.fadeIn || 0) > 0.01 || (c.fadeOut || 0) > 0.01;
    const w = Math.max(3, xOf(clipLen(c)));
    const node = document.createElement('div');
    node.className = ['clip', c.kind === 'audio' ? 'audio' : '', S.selClip === c.id ? 'sel' : '',
                      live ? 'live' : '', trimmed ? 'trim' : '', hasFade ? 'hasfade' : ''].filter(Boolean).join(' ');
    node.dataset.clip = c.id;
    node.style.left = xOf(c.start) + 'px';
    node.style.width = w + 'px';
    if (c.strip) node.style.backgroundImage = 'url(' + c.strip + ')';
    node.title = c.name + ' · ' + mmss(c.start) + ' → ' + mmss(clipEnd(c))
      + (c.kind === 'image' ? ' · still, held ' + clipLen(c).toFixed(1) + 's — drag the right end to hold it longer'
         : trimmed ? ' · trimmed ' + mmss(c.in) + ' → ' + mmss(c.out) + ' of ' + mmss(c.dur) : '')
      + (hasFade ? ' · fade ' + (c.fadeIn || 0).toFixed(1) + 's / ' + (c.fadeOut || 0).toFixed(1) + 's' : '')
      + ' — drag to move, drag an end to trim, drag a top corner to fade';
    node.innerHTML = '<i class="h a" data-trim="a"></i><i class="h b" data-trim="b"></i>'
      + fadeSVG(c, w) + '<span class="lab">' + esc(c.name) + '</span>'
      + fadeGrips(c, w);
    node.addEventListener('pointerdown', (e) => clipDown(e, node));
    node.querySelectorAll('[data-fade]').forEach(g =>
      g.addEventListener('pointerdown', (e) => fadeDown(e, c, g.dataset.fade, g.dataset.mode)));
    node.querySelectorAll('[data-act]').forEach(b => {
      b.addEventListener('pointerdown', (e) => e.stopPropagation());
      b.addEventListener('click', (e) => { e.stopPropagation(); fadeAct(c.id, b.dataset.act); });
    });
    lane.appendChild(node);
    /* and the crossfade region, marked on the lane it is happening over */
    const xf = crossPartner(c);
    if (xf && (c.fadeIn > 0.05 || c.fadeOut > 0.05)) {
      const band = document.createElement('div');
      band.className = 'xf';
      band.style.left = xOf(xf.from) + 'px';
      band.style.width = Math.max(2, xOf(xf.to) - xOf(xf.from)) + 'px';
      lane.appendChild(band);
    }
}

/* ---------- the fade, as a shape ----------
   A wedge of darkness over each end, with the hypotenuse bent by the easing. Drawn
   in the clip's own pixels — so it re-renders on zoom like everything else — and
   with `H` a nominal height the SVG stretches to the lane. */
const H = 100;
function fadeSVG(c, w) {
  const fi = xOf(c.fadeIn || 0), fo = xOf(c.fadeOut || 0);
  if (fi < 1 && fo < 1) return '';
  const ei = c.easeIn === undefined ? 0.5 : c.easeIn;
  const eo = c.easeOut === undefined ? 0.5 : c.easeOut;
  let d = '';
  /* IN: opaque at the left edge, clear by `fadeIn`. The control point rides the
     easing — high holds the darkness and then lets go, low lets go at once. */
  if (fi >= 1) d += 'M0,0 L0,' + H + ' Q' + (fi * (1 - ei) * 2).toFixed(1) + ',' + (H * (1 - ei) * 2).toFixed(1)
    + ' ' + fi.toFixed(1) + ',0 Z ';
  if (fo >= 1) {
    const x0 = w - fo;
    d += 'M' + w + ',0 L' + w + ',' + H + ' Q' + (w - fo * (1 - eo) * 2).toFixed(1) + ','
      + (H * (1 - eo) * 2).toFixed(1) + ' ' + x0.toFixed(1) + ',0 Z';
  }
  return '<svg class="fades" viewBox="0 0 ' + w + ' ' + H + '" preserveAspectRatio="none"><path d="' + d + '"/></svg>';
}
/* two grips per end: LENGTH on the top edge, SHAPE on the ramp. The shape grip only
   appears once there is a fade to shape — a control for a thing that does not exist
   is a control that teaches somebody the wrong model. */
function fadeGrips(c, w) {
  const fi = xOf(c.fadeIn || 0), fo = xOf(c.fadeOut || 0);
  let h = '<i class="fgrip in" data-fade="in" data-mode="len" style="left:' + Math.max(9, fi) + 'px"'
        + ' title="Drag right to fade this clip up from black"></i>'
        + '<i class="fgrip out" data-fade="out" data-mode="len" style="left:' + Math.max(0, w - fo - 9) + 'px"'
        + ' title="Drag left to fade this clip out to black"></i>';
  const ei = c.easeIn === undefined ? 0.5 : c.easeIn;
  const eo = c.easeOut === undefined ? 0.5 : c.easeOut;
  if (fi >= 14) h += '<i class="fgrip ease" data-fade="in" data-mode="ease" style="left:' + (fi / 2)
    + 'px;top:' + (100 - (1 - ei) * 100) + '%" title="Drag up or down to bend the ramp"></i>';
  if (fo >= 14) h += '<i class="fgrip ease" data-fade="out" data-mode="ease" style="left:' + (w - fo / 2)
    + 'px;top:' + (100 - (1 - eo) * 100) + '%" title="Drag up or down to bend the ramp"></i>';
  /* the coarse controls, on the clip. Only where there is room for them — a 40px
     block cannot carry three buttons and would rather carry its name. */
  if (w >= 130) {
    const xf = crossPartner(c);
    h += '<span class="acts">'
      + '<button data-act="in" title="One second up from black — drag the corner for anything else">FADE IN</button>'
      + '<button class="x" data-act="cross"' + (xf ? '' : ' disabled')
      +   ' title="' + (xf ? 'Cross-fade with ' + esc(xf.other.name) + ' on the layer below, over the ' + xf.overlap.toFixed(1) + 's they share'
                          : 'Nothing overlapping on the layer below to cross-fade with') + '">X-FADE</button>'
      + '<button data-act="out" title="One second down to black">FADE OUT</button>'
      + '</span>';
  }
  return h;
}

/* ---------- WHAT A CROSSFADE ACTUALLY IS ----------
   Not an effect between two clips: two ramps, on two clips, over the stretch of
   time they are both running. So the partner is the clip on the video layer
   DIRECTLY BELOW this one that overlaps it — below, because the picture is a stack
   and a crossfade is the top one getting out of the way of the one underneath. */
function crossPartner(c) {
  const q = seqOfTrack(c.trackId); if (!q || c.kind === 'audio') return null;
  const vid = q.tracks.filter(t => t.kind === 'video').map(t => t.trackId);
  const i = vid.indexOf(c.trackId);
  if (i <= 0) return null;                       // V1 has nothing under it
  for (let j = i - 1; j >= 0; j--) {
    /* ANY clip on that lower lane, not "the" one: the lane is a running order now, so
       what this clip overlaps is whichever shot down there happens to be under it */
    for (const other of clipsOn(vid[j])) {
      if (clipLen(other) <= 0) continue;
      const from = Math.max(c.start, other.start);
      const to = Math.min(clipEnd(c), clipEnd(other));
      if (to - from > 0.08) return { trackId: vid[j], other, overlap: to - from, from, to };
    }
  }
  return null;
}

/* the three coarse actions */
function fadeAct(clipId, act) {
  const c = S.clips.get(clipId); if (!c) return;
  const max = clipLen(c);
  if (act === 'in') {
    c.fadeIn = Math.abs((c.fadeIn || 0) - 1) < 0.01 ? 0 : Math.min(1, Math.max(0, max - (c.fadeOut || 0)));
    toast(c.fadeIn ? c.name + ' fades up over ' + c.fadeIn.toFixed(1) + 's' : c.name + ' starts at full');
  } else if (act === 'out') {
    c.fadeOut = Math.abs((c.fadeOut || 0) - 1) < 0.01 ? 0 : Math.min(1, Math.max(0, max - (c.fadeIn || 0)));
    toast(c.fadeOut ? c.name + ' fades out over ' + c.fadeOut.toFixed(1) + 's' : c.name + ' ends at full');
  } else if (act === 'cross') {
    const xf = crossPartner(c);
    if (!xf) return toast('nothing overlapping on the layer below');
    /* THE OVERLAP IS THE CROSSFADE. The top clip fades UP across it and the one
       underneath fades DOWN across the same stretch, so the sum of them is one
       picture for its whole length rather than a dip through black in the middle. */
    const n = Math.min(xf.overlap, clipLen(c), clipLen(xf.other));
    if (c.start >= xf.other.start) { c.fadeIn = n; xf.other.fadeOut = n; }
    else { c.fadeOut = n; xf.other.fadeIn = n; }
    toast('cross-fade with ' + xf.other.name + ' over ' + n.toFixed(1) + 's');
  }
  build(); publishClips();
}

/* dragging a fade. LENGTH horizontally, SHAPE vertically, never both — a grip that
   does two things at once does neither predictably. */
function fadeDown(e, c, which, mode) {
  e.preventDefault(); e.stopPropagation();
  dragging = true;
  S.selClip = c.id;
  const x0 = e.clientX, y0 = e.clientY;
  const len0 = which === 'in' ? (c.fadeIn || 0) : (c.fadeOut || 0);
  const ease0 = which === 'in' ? (c.easeIn === undefined ? 0.5 : c.easeIn)
                               : (c.easeOut === undefined ? 0.5 : c.easeOut);
  const max = clipLen(c);
  const onMove = (ev) => {
    if (mode === 'len') {
      const d = (which === 'in' ? (ev.clientX - x0) : (x0 - ev.clientX)) / Z.pps;
      const v = Math.max(0, Math.min(max, len0 + d));
      if (which === 'in') c.fadeIn = v; else c.fadeOut = v;
      /* two fades cannot overlap: past the middle they would be fighting over the
         same frames, and the picture would be darker than either of them asked for */
      const total = (c.fadeIn || 0) + (c.fadeOut || 0);
      if (total > max) {
        if (which === 'in') c.fadeIn = Math.max(0, max - (c.fadeOut || 0));
        else c.fadeOut = Math.max(0, max - (c.fadeIn || 0));
      }
    } else {
      const v = Math.max(0.05, Math.min(0.95, ease0 - (ev.clientY - y0) / 90));
      if (which === 'in') c.easeIn = v; else c.easeOut = v;
    }
    paintClips();
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    dragging = false;
    build(); publishClips();
    toast(c.name + ' · fade ' + (c.fadeIn || 0).toFixed(1) + 's up, ' + (c.fadeOut || 0).toFixed(1) + 's down');
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

function routeLabel(route) {
  if (!route) return '';
  const d = S.targets.find(x => x.id === route);
  return d ? (d.short || d.label) : route;
}

function paintSeqBar() {
  const q = curSeq();
  el('seqlabel').textContent = q ? q.name : '—';
  el('seqcount').textContent = S.seqs.length > 1 ? (S.seqs.findIndex(x => x.id === S.cur) + 1) + '/' + S.seqs.length : '';
  const r = el('b-route');
  const lab = q ? routeLabel(q.route) : '';
  r.classList.toggle('on', !!lab);
  r.querySelector('b').textContent = lab || 'ROUTE →';
  r.disabled = !q;
  const cropped = q && q.crop && (q.crop.x || q.crop.y || q.crop.rot || q.crop.cover === false);
  /* THE BUTTON SAYS WHAT IT WILL CROP, because "CROP" meaning two different things
     depending on what is selected is the sort of button people learn to distrust. */
  const tgt = cropTarget();
  const perTrack = tgt && tgt.level === 'track';
  el('b-crop').textContent = perTrack ? 'CROP LAYER' : 'CROP SEQUENCE';
  el('b-crop').title = perTrack
    ? 'Crop this layer into its surface on its own — the handles are drawn on the wall in the Scene Study'
    : 'Crop this whole sequence into its surface — every layer without a frame of its own follows. Select a video layer to crop just that one';
  el('b-crop').classList.toggle('on', !!(perTrack ? hasOwnCrop(q, tgt.trackId) : cropped));
  el('b-crop').disabled = !q || !q.route;
  el('b-seqdup').disabled = !q;
  el('b-seqdel').disabled = !q;
  if (armedDelete !== (q && q.id)) { el('b-seqdel').textContent = 'DELETE'; el('b-seqdel').classList.remove('on'); }
}

function paintRuler() {
  const ru = el('ruler');
  if (!isFinite(T.span) || T.span <= 0) T.span = 60;
  /* THE TICK INTERVAL IS A FUNCTION OF THE ZOOM, not of the show's length. At two
     pixels per second a tick every five seconds is a grey smear; at eighty it is
     one label every four hundred pixels. So the step is the smallest of a fixed
     ladder that still leaves about 70px between labels — which is what keeps the
     ruler readable at every zoom instead of at one. */
  const LADDER = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600];
  const step = LADDER.find(v => v * Z.pps >= 70) || LADDER[LADDER.length - 1];
  let h = '<span class="corner"></span>';
  for (let n = 0; n <= T.span + 0.001; n += step) {
    h += '<div class="tk" style="left:' + (GUT() + xOf(n)) + 'px">' + mmss(n).slice(0, 5) + '</div>';
  }
  h += '<div class="loopbar' + (T.loop ? ' on' : '') + '" id="loopbar" style="left:'
     + (GUT() + xOf(T.loopIn)) + 'px;width:' + Math.max(4, xOf(loopOut()) - xOf(T.loopIn))
     + 'px" title="Drag to slide the loop, drag an end to trim it">'
     + '<i class="a" data-edge="a"></i><i class="b" data-edge="b"></i></div>';
  ru.innerHTML = h;
  ru.querySelector('#loopbar').addEventListener('pointerdown', (e) => loopDown(e, ru));
}
/* THE RULER SCRUBS, CONTINUOUSLY. A press that only jumps once is a press that has
   to be repeated to find a frame; every editor drags along the ruler instead. */
el('ruler').addEventListener('pointerdown', (e) => {
  if (e.target.closest('#loopbar')) return;
  e.preventDefault();
  const r = el('ruler').getBoundingClientRect();
  const at = (cx) => scrubTo(secAt(cx - r.left - GUT()));
  at(e.clientX);
  const onMove = (ev) => at(ev.clientX);
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
});

/* AND THE PLAYHEAD ITSELF IS THE HANDLE. Reaching for the thing you want to move
   is what a hand does before it thinks about which strip to use, and the playhead
   is a thing on the screen. Snaps like everything else — parking exactly on a cut
   is the point of parking at all. */
el('head').querySelector('i').addEventListener('pointerdown', (e) => {
  e.preventDefault(); e.stopPropagation();
  dragging = true;
  el('head').classList.add('grab');
  const sc = el('hscroll');
  const r0 = sc.getBoundingClientRect();
  const onMove = (ev) => {
    const raw = secAt(sc.scrollLeft + (ev.clientX - r0.left) - GUT());
    scrubTo(snap(Math.max(0, raw), null, ev.altKey));
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    dragging = false; showSnap(null);
    el('head').classList.remove('grab');
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
});

el('b-snap').addEventListener('click', () => {
  snapOn = !snapOn;
  el('b-snap').classList.toggle('on', snapOn);
  toast(snapOn ? 'snapping on — hold ALT to override it for one drag' : 'snapping off');
});

function paintHead() {
  el('head').style.left = (GUT() + xOf(T.t)) + 'px';
  el('clock').innerHTML = mmss(T.t) + ' <i>/</i> ' + mmss(T.span);
  let changed = false;
  S.clips.forEach((c) => {
    const live = T.t >= c.start && T.t < clipEnd(c);
    if (live !== c._live) { c._live = live; changed = true; }
  });
  if (changed) {
    document.querySelectorAll('[data-clip]').forEach(node => {
      const c = S.clips.get(node.dataset.clip);
      if (c) node.classList.toggle('live', !!c._live);
    });
    paintFoot();
  }
  /* FOLLOW THE PLAYHEAD WHEN IT RUNS OFF THE EDGE. Zoomed in, a show is many
     screens wide and a transport that leaves the picture behind is a transport
     nobody can watch. Only while playing, and only when it actually leaves —
     scrolling under somebody who is dragging a clip would be worse than useless. */
  if (T.playing && !dragging) {
    const sc = el('hscroll');
    const x = xOf(T.t), left = sc.scrollLeft, right = left + sc.clientWidth - GUT() - 12;
    if (x < left || x > right) sc.scrollLeft = Math.max(0, x - (sc.clientWidth - GUT()) * 0.25);
  }
}

function paintChrome() {
  const any = S.clips.size > 0;
  el('b-play').disabled = !any;
  el('b-stop').disabled = !any;
  el('b-play').textContent = T.playing ? 'PAUSE' : 'PLAY';
  el('b-play').classList.toggle('on', T.playing);
  el('b-loop').classList.toggle('on', T.loop);
  el('b-unit').textContent = T.unit === 's' ? 'SEC' : 'MIN';
  el('len').innerHTML = 'LENGTH <b>' + mmss(T.span).slice(0, 5) + '</b>' + (T.autoSpan ? '' : ' ·');
  const q = curSeq();
  el('b-load').disabled = !q || !rowsOf(q).length;
  el('b-vtrack').disabled = !q;
  el('b-atrack').disabled = !q;
}

function status() {
  const st = el('st');
  st.className = 'st ' + (EMBEDDED ? (S.live ? 'live' : '') : 'alone');
  st.innerHTML = EMBEDDED ? 'HOST <b>' + (S.live ? 'LIVE' : 'CONNECTING') + '</b>'
                          : 'STANDALONE <b>MOCK TAKE</b>';
}

/* the footer answers the question the panel exists to answer: is this cue actually
   sequenced, and has it been given somewhere to go */
function paintFoot() {
  const q = curSeq();
  const list = rowsOf(q);
  const mine = list.flatMap(r => clipsOn(r.trackId));
  const live = [...S.clips.values()].filter(c => c._live);
  const unrouted = S.seqs.filter(x => !x.route).length;
  const bits = [];
  bits.push('<span class="chip"><b>' + S.seqs.length + '</b> SEQUENCE' + (S.seqs.length === 1 ? '' : 'S')
    + (unrouted ? ' · <b>' + unrouted + '</b> WITH NO OUTPUT' : '') + '</span>');
  if (q) {
    const v = list.filter(r => r.kind === 'video').length, a2 = list.length - v;
    bits.push('<span class="chip">EDITING <b>' + esc(q.name) + '</b> · ' + v + 'V · ' + a2 + 'A · '
      + mine.length + ' CLIPS</span>');
    bits.push('<span class="chip ' + (q.route ? 'ok' : 'warn') + '">OUTPUT <b>'
      + (routeLabel(q.route) || 'NOT SET') + '</b></span>');
  }
  if (!S.targets.length && S.clips.size) bits.push('<span class="chip warn">NO SURFACE IN THE ROOM YET</span>');
  /* ON AIR is the WHOLE take now, not this cue: everything is stacked, so what is
     running at the playhead is a fact about the show rather than about the lane
     somebody happens to have selected. */
  bits.push('<span class="chip">ON AIR <b>' + (live.length ? live.map(c => c.name).join(' · ') : 'nothing') + '</b></span>');
  el('foot').innerHTML = bits.join('');
}

/* ==========================================================================
   9 · MOVING AND TRIMMING
   One gesture with three meanings, decided by where it started: the body moves the
   clip in time, an end trims that end. Trimming the HEAD holds the picture still —
   the frame under the cut stays where it is on the clock.
   ========================================================================== */
function clipDown(e, node) {
  e.preventDefault(); e.stopPropagation();
  const clipId = node.dataset.clip;
  const c = S.clips.get(clipId);
  if (!c) return;
  const trackId = c.trackId;
  S.selClip = clipId; S.sel = trackId;
  S.focus = { kind: 'clip', id: clipId };
  const trim = e.target.dataset ? e.target.dataset.trim : null;
  /* one second per `pps` pixels, at whatever the zoom is — which is the whole
     reason for zooming: at 80 px/s a frame is a real distance for a hand */
  const perPx = 1 / Z.pps;
  const x0 = e.clientX, start0 = c.start, in0 = c.in, out0 = c.out;
  dragging = true;
  node.style.cursor = trim ? 'ew-resize' : 'grabbing';
  if (!trim && (T.t < c.start || T.t >= clipEnd(c))) scrubTo(c.start + Math.min(1, clipLen(c) * 0.2));

  /* the clip in hand is not something to snap to, and the room it has is measured
     before the hand moves so it cannot shift underneath the gesture */
  const mine = new Set([clipId]);
  const gap = laneGap(c);
  const onMove = (ev) => {
    const d = (ev.clientX - x0) * perPx;
    if (trim === 'a') {
      const nin = Math.max(0, Math.min(out0 - 0.1, in0 + d));
      /* and not back into the shot before it — see `laneGap` */
      const lo = Math.max(0, gap.lo);
      const head = Math.max(lo, start0 + (nin - in0));
      c.in = in0 + (head - start0); c.start = head;
    } else if (trim === 'b') {
      /* the TAIL is what snaps when you trim the tail */
      const want = Math.min(gap.hi, snap(start0 + (out0 - in0) + d, mine, ev.altKey));
      c.out = Math.max(in0 + 0.1, Math.min(outMax(c), in0 + (want - c.start)));
    } else {
      /* BOTH ENDS are candidates when the block is being slid: whichever is closer
         to something worth landing on wins, which is what makes butting a clip up
         against the one before it a single gesture instead of a fiddle */
      const raw = Math.max(0, start0 + d);
      const len = clipLen(c);
      const sHead = snap(raw, mine, ev.altKey);
      const sTail = snap(raw + len, mine, ev.altKey) - len;
      c.start = Math.abs(sHead - raw) <= Math.abs(sTail - raw) ? sHead : Math.max(0, sTail);
      showSnap(c.start === sHead && sHead !== raw ? sHead
             : (c.start === sTail && sTail !== raw ? c.start + len : null));
    }
    /* only the blocks move while the hand is down — `build` would rebuild every
       lane in every group on every pointermove, which at six sequences is a
       redraw of the whole panel sixty times a second */
    reSpan(); paintClips();
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    dragging = false; showSnap(null);
    /* dropped on top of a neighbour: slid clear of it, to the side it came from */
    const shoved = !trim && deOverlap(c);
    reSpan(); build();
    publishClips(); reportMedia(trackId);
    toast(c.name + ' · ' + mmss(c.start) + ' → ' + mmss(clipEnd(c))
      + (shoved ? ' — moved clear of the clip it landed on' : '')
      + (c.kind === 'image' ? ' (held)'
         : (c.in > 0.01 || c.out < c.dur - 0.01 ? ' (trimmed from ' + mmss(c.dur) + ')' : '')));
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  build();
}

function loopDown(e, ruler) {
  e.preventDefault(); e.stopPropagation();
  const edge = e.target.dataset ? e.target.dataset.edge : null;
  const x0 = e.clientX, in0 = T.loopIn, out0 = loopOut();
  T.loop = true;
  const onMove = (ev) => {
    const d = (ev.clientX - x0) / Z.pps;
    if (edge === 'a') T.loopIn = Math.max(0, Math.min(out0 - 0.5, in0 + d));
    else if (edge === 'b') T.loopOut = Math.min(T.span, Math.max(in0 + 0.5, out0 + d));
    else {
      const len = out0 - in0;
      T.loopIn = Math.max(0, Math.min(T.span - len, in0 + d));
      T.loopOut = T.loopIn + len;
    }
    paintRuler(); paintClips();
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    publishTransport();
    toast('loop ' + mmss(T.loopIn).slice(0, 5) + ' → ' + mmss(loopOut()).slice(0, 5));
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

el('len').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const x0 = e.clientX, span0 = T.span, per = T.unit === 's' ? 1 : 60;
  const onMove = (ev) => setSpan(span0 + Math.round((ev.clientX - x0) / 6) * per);
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    toast('the show is ' + mmss(T.span).slice(0, 5) + ' long');
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
});

/* ==========================================================================
   10 · WHERE THE SEQUENCE IS THROWN, AND HOW IT SITS IN THE FRAME
   Both at sequence level, both for the same reason: a wall shows ONE picture, and
   the cue is what makes that picture. A LINKED CANVAS comes first in the list — it
   is what somebody who has just joined three walls is looking for.
   ========================================================================== */
function closeMenu() { el('menu').classList.remove('open'); }
window.addEventListener('pointerdown', (e) => { if (!e.target.closest('.menu')) closeMenu(); }, true);

function openMenu(anchor, title, items, onPick) {
  const m = el('menu');
  m.innerHTML = '<span class="k">' + esc(title) + '</span>'
    + items.map(it => '<button data-v="' + esc(it.value) + '" class="' + (it.on ? 'on' : '') + '">'
        + esc(it.label) + (it.note ? '<i>' + esc(it.note) + '</i>' : '') + '</button>').join('');
  const r = anchor.getBoundingClientRect();
  m.classList.add('open');
  const h = Math.min(320, m.scrollHeight);
  m.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 214)) + 'px';
  m.style.top = Math.max(4, Math.min(r.bottom + 4, window.innerHeight - h - 6)) + 'px';
  m.onclick = (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    closeMenu(); onPick(b.dataset.v);
  };
}

el('seqpick').addEventListener('click', () => {
  if (!S.seqs.length) return;
  openMenu(el('seqpick'), 'Sequences', S.seqs.map(q => ({
    value: q.id, label: q.name, on: q.id === S.cur,
    note: (rowsOf(q).length || 0) + ' TR' + (q.route ? ' · ' + routeLabel(q.route) : ''),
  })), pickSeq);
});

el('b-route').addEventListener('click', () => {
  const q = curSeq(); if (!q) return;
  const surfaces = S.targets.filter(d => d.req === 'link' || d.req === 'led' || d.req === 'projectors');
  if (!surfaces.length) {
    return toast(EMBEDDED
      ? 'no LED wall or projector in this take yet — build one in the Scene Study or the Sketch Pad'
      : 'no surfaces in the mock take');
  }
  const items = surfaces.map(d => ({
    value: d.id, label: d.label, on: q.route === d.id,
    note: d.req === 'link' ? (d.note || 'CANVAS') : d.req === 'led' ? 'LED WALL' : 'PROJECTOR',
  }));
  if (q.route) items.push({ value: '', label: '— nowhere —' });
  openMenu(el('b-route'), 'Send ' + q.name + ' to', items, (v) => {
    q.route = v || null;
    /* choosing "— nowhere —" is a DECISION and is remembered as one, so the null it
       sends is distinguishable from a sequence that was simply never routed */
    q.routeCleared = !q.route;
    build(); publishClips();
    q.tracks.forEach(t => reportMedia(t.trackId));
    toast(q.route ? q.name + ' → ' + (routeLabel(q.route) || q.route) : q.name + ' is routed nowhere');
  });
});

el('b-crop').addEventListener('click', () => {
  const t = cropTarget(); if (!t) return;
  const q = t.q;
  if (!q.route) return toast('give this sequence an output first — a crop needs something to crop into');
  if (!t.trackId) return toast('load a clip on a video track first');
  /* relayed, not answered: cropping is a gesture on the WALL, and the wall is geometry
     only the Scene Study holds. What changes with the LEVEL is not the gesture but where
     the answer is written — see `cropFor`. A selected video layer is cropped on its own;
     with nothing selected the cue is cropped and every layer inheriting follows. */
  cropArmed = { level: t.level, trackId: t.trackId };
  post('armCrop', { trackId: t.trackId, seqId: q.id, level: t.level, members: t.members || [] });
  const label = laneClipNow(t.trackId);
  toast(t.level === 'track'
    ? 'cropping ' + (label ? label.name : 'this layer') + ' on its own — the handles are on the wall'
    : 'cropping ' + q.name + ' — every layer without its own frame follows');
});

/* ==========================================================================
   11 · THE BAR
   ========================================================================== */
el('b-play').addEventListener('click', () => setPlaying(!T.playing));
el('b-stop').addEventListener('click', () => { setPlaying(false); scrubTo(T.loop ? T.loopIn : 0); });
el('b-loop').addEventListener('click', () => { T.loop = !T.loop; build(); publishTransport(); });
el('b-unit').addEventListener('click', () => { T.unit = T.unit === 's' ? 'm' : 's'; paintChrome(); });

/* ---------- the zoom controls ----------
   Buttons step by a factor rather than by an amount, because zoom is perceived
   multiplicatively: going 4 → 8 px/s and 100 → 200 px/s should feel like the same
   gesture. The readout is also a scrub, for the same reason LENGTH is. */
const ZSTEP = 1.5;
el('b-zin').addEventListener('click', () => setZoom(Z.pps * ZSTEP, T.t));
el('b-zout').addEventListener('click', () => setZoom(Z.pps / ZSTEP, T.t));
el('b-zfit').addEventListener('click', () => { zoomFit(); toast('the whole show, ' + mmss(T.span).slice(0, 5) + ' of it'); });
el('zlvl').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const x0 = e.clientX, p0 = Z.pps;
  const onMove = (ev) => setZoom(p0 * Math.pow(1.02, ev.clientX - x0), T.t);
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
});

/* ⌘/Ctrl + wheel zooms AT THE POINTER — the frame under the cursor stays under the
   cursor, which is the only zoom that lets you keep working on the thing you were
   already looking at. A plain wheel is left alone: it scrolls the lanes, which is
   what a wheel does everywhere else in this workspace. */
el('hscroll').addEventListener('wheel', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const sc = el('hscroll');
  const r = sc.getBoundingClientRect();
  const px = e.clientX - r.left - GUT();               // pointer, in lane pixels
  const at = secAt(sc.scrollLeft + px);
  setZoom(Z.pps * Math.pow(0.999, e.deltaY), at, px);
}, { passive: false });
el('b-load').addEventListener('click', () => {
  const q = curSeq(); if (!q) return;
  if (!S.sel) {
    const first = rowsOf(q)[0];
    if (!first) return toast('add a track first');
    S.sel = first.trackId; build();
  }
  el('f-pick').click();
});
el('f-pick').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) loadFile(S.sel, f);
  e.target.value = '';
});

document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  /* A BIN ITEM DROPPED NEAR A LANE RATHER THAN ON ONE. Aiming at a 32px row while
     dragging a thumbnail from another panel is a real miss, and a miss that does
     nothing at all reads as "this feature does not work". The selected lane is
     where it goes, and it says so. */
  const raw = binPayload(e.dataTransfer);
  if (raw) {
    /* NOT ON A LANE. Aiming at a 32px row while dragging a thumbnail from another
       panel is a real miss, and a miss that does nothing reads as "this does not
       work". `landAsset` finds a lane or makes one. */
    try { landAsset(JSON.parse(raw), null); }
    catch (err) { toast('could not read that drop'); }
    return;
  }
  const f = e.dataTransfer.files[0];
  if (!f) return;
  landFile(f);
});
document.addEventListener('dragover', (e) => { try { e.dataTransfer.dropEffect = 'copy'; } catch (err) {} });

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  /* SPACE PLAYS. Two things stopped it: a focused button eats the key as a click,
     and a panel that has never been clicked in has no focus for the key to arrive
     at at all. The first is fixed by taking focus off the button; the second by
     `takeFocus` below, which claims it on the first pointer that touches the
     panel — so SPACE works after any interaction rather than after the right one. */
  if (k === ' ') {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    setPlaying(!T.playing);
    return;
  }
  else if (k === 'l') { T.loop = !T.loop; build(); publishTransport(); }
  else if (k === 'home') scrubTo(0);
  else if (k === 'arrowleft') scrubTo(T.t - (e.shiftKey ? 5 : 1));
  else if (k === 'arrowright') scrubTo(T.t + (e.shiftKey ? 5 : 1));
  else if (k === '=' || k === '+') { e.preventDefault(); setZoom(Z.pps * ZSTEP, T.t); }
  else if (k === '-' || k === '_') { e.preventDefault(); setZoom(Z.pps / ZSTEP, T.t); }
  else if (k === '0') { e.preventDefault(); zoomFit(); }
  /* ---------- DELETE, ON WHATEVER IS FOCUSED ----------
     Three things can be, and the key removes the one that is — a clip off its lane,
     a cue off its sequence, or a whole track off the take. The last is the only
     destructive one and it is the only one that needs the track's NAME to have been
     clicked, which is a deliberate enough act to stand for consent. */
  else if (k === 'delete' || k === 'backspace') {
    e.preventDefault();
    const f = S.focus;
    if (f && f.kind === 'cue') {
      const q = S.seqs.find(x => x.id === f.id);
      if (q && q.cue) {
        const was = q.cue.label; q.cue = null; S.focus = null;
        build(); publishGrouping();
        toast(was + ' removed');
      }
      return;
    }
    if (f && f.kind === 'clip' && S.clips.has(f.id)) {
      const gone = S.clips.get(f.id);
      const name = gone.name, lane = gone.trackId;
      dropClip(f.id); S.focus = { kind: 'track', id: lane };
      build(); publishClips();
      toast(name + ' removed from that lane — the track is still on the take');
      return;
    }
    if (f && f.kind === 'track') { delTrack(f.id); return; }
    /* A SELECTED CUE. Immediate, like the clip and track branches above it and unlike the
       button, which arms first: a key press is already deliberate in a way that a click on
       a button labelled DELETE is not — the button sits permanently next to DUPLICATE. */
    if (f && f.kind === 'seq') {
      const q = S.seqs.find(x => x.id === f.id);
      if (q) delSeq(q);
      return;
    }
    if (S.selClip) {
      dropClip(S.selClip); build(); publishClips();
      toast('clip removed from that lane');
    }
  }
});

window.addEventListener('resize', () => layout());

/* the panel claims the keyboard the moment it is touched — an iframe that has
   never been clicked in receives no key events at all, which is why SPACE did
   nothing until somebody happened to press a button first */
function takeFocus() { try { window.focus(); } catch (e) {} }
window.addEventListener('pointerdown', takeFocus, true);
/* and a button that has just been pressed gives the keyboard back, so the next
   SPACE is a transport command and not a second press of that button */
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && b.blur) setTimeout(() => b.blur(), 0);
});

/* ==========================================================================
   12 · STANDALONE
   ========================================================================== */
if (!EMBEDDED) {
  el('dev').classList.add('on');
  S.takeId = 'mock';
  S.tracks = [
    { id: 'mock-t1', label: 'TRACK 1', name: '' }, { id: 'mock-t2', label: 'TRACK 2', name: '' },
    { id: 'mock-t3', label: 'TRACK 3', name: '' },
  ];
  S.targets = [
    { id: 'mock-link1', label: 'CANVAS OF 3', req: 'link', note: '3 WALLS' },
    { id: 'mock-led1', label: 'LED 1', req: 'led' },
    { id: 'mock-proj1', label: 'PROJ 1', req: 'projectors' },
  ];
  S.seqs = [{ id: newSeqId(), name: 'SEQUENCE 1', route: null, crop: null, tracks: [
    { trackId: 'mock-t1', kind: 'video' }, { trackId: 'mock-t2', kind: 'video' },
    { trackId: 'mock-t3', kind: 'audio' },
  ] }];
  S.cur = S.seqs[0].id;
  S.sel = 'mock-t1';
  S.live = true;
}
ensureSequence();
el('b-snap').classList.toggle('on', snapOn);
status();
build();
/* the show fits the panel on the way in — a timeline that opens at an arbitrary
   zoom makes somebody's first gesture a correction rather than a decision */
zoomFit();
paintZoom();

post('ready', { capabilities: ['sequence', 'grouping', 'transport', 'routing', 'trim', 'audio'] });
</script>
</body>
</html>
